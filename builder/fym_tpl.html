<!doctype html>
<html lang="en"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Mat-ching by Mahj Matchmaker</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bitter:wght@400;600;700&family=Alfa+Slab+One&family=Playfair+Display:ital,wght@1,500&family=Bitter:wght@600;700&family=Shrikhand&display=swap">
<style>
:root{--pink:#c8325f;--flame:#f56c8c;--pink2:#fbe3ec;--navy:#054689;--ink:#2a2036;--mute:#7a6a85;--cream:#f6e9df;--line:#ecd5df;--bg:#fff;--card:#fff;--body:'Bitter',Georgia,serif}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#fff}}
:root[data-theme="dark"]{--bg:#fff}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:#fdf3f7;color:var(--ink);font-family:var(--body);-webkit-tap-highlight-color:transparent}
button{font-family:inherit;color:inherit}
#app{max-width:520px;margin:0 auto;height:100dvh;display:flex;flex-direction:column;background:var(--bg);overflow:hidden;position:relative}
@media (min-width:560px){#app{box-shadow:0 0 0 1px var(--line),0 20px 60px rgba(120,40,80,.12)}}
.top{flex:none;display:flex;align-items:center;gap:10px;padding:calc(8px + env(safe-area-inset-top,0px)) 14px 6px}
.top img{height:30px;width:auto}
.top .stp{margin-left:auto;font:700 12px var(--body);letter-spacing:.06em;color:var(--pink);text-transform:uppercase;text-align:right;line-height:1.15}
.top .stp small{display:block;color:var(--mute);font-weight:500;letter-spacing:.02em;text-transform:none}
#stage{flex:1;min-height:0;display:flex;flex-direction:column;gap:8px;padding:0 12px calc(10px + env(safe-area-inset-bottom,0px))}
#stage.scroll{overflow-y:auto}
/* tile band */
.band{flex:none;position:relative;border-radius:18px;overflow:hidden;height:clamp(60px,12dvh,104px);background:#eee center/cover no-repeat;display:flex;align-items:flex-end}
.band.sm{height:clamp(48px,8.5dvh,76px)}
.band::after{content:"";position:absolute;inset:0;background:linear-gradient(90deg,rgba(32,16,32,.72),rgba(32,16,32,.1) 70%)}
.band .bt{position:relative;z-index:1;padding:8px 12px;color:#fff;min-width:0;flex:1}
.band .bt i{display:block;font:700 10px var(--body);letter-spacing:.22em;text-transform:uppercase;font-style:normal;opacity:.85}
.band .bt b{display:block;font:400 clamp(20px,5.6vw,26px)/1 'Alfa Slab One',Georgia,serif;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.band .chg{position:relative;z-index:1;margin:0 10px 10px 0;border:0;border-radius:999px;background:rgba(255,255,255,.92);color:var(--pink);font:700 12px var(--body);padding:6px 11px;cursor:pointer;white-space:nowrap}
/* couple mat band */
.couple{flex:1.25 1 0;min-height:110px;position:relative;border-radius:18px;background:#fff;border:2px solid var(--line);display:flex;align-items:center;justify-content:center;padding:8px}
.couple img{max-width:100%;max-height:100%;object-fit:contain}
.couple img.ph{border-radius:12px}
.couple .cap{position:absolute;left:10px;top:8px;background:var(--pink2);color:#a3285a;border-radius:999px;font:700 11px var(--body);padding:4px 9px;max-width:60%;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.couple .chg{position:absolute;right:8px;top:6px;border:0;border-radius:999px;background:#fff;color:var(--pink);font:700 12px var(--body);padding:5px 10px;cursor:pointer;box-shadow:0 1px 0 var(--line)}
/* middle: rail + viewer */
.mid{flex:1;min-height:0;display:grid;grid-template-columns:48px 1fr;gap:8px}
.rail{display:flex;flex-direction:column;gap:7px;overflow-y:auto;scrollbar-width:none;padding:2px 0}
.rail::-webkit-scrollbar{display:none}
.rb{flex:none;width:46px;height:46px;border-radius:50%;border:2px solid var(--line);background:#fff;cursor:pointer;display:flex;align-items:center;justify-content:center;padding:0;position:relative}
.rb[aria-pressed="true"]{border-color:var(--navy);box-shadow:0 0 0 3px rgba(36,52,143,.18)}
.rb i{width:28px;height:28px;border-radius:50%;display:block;box-shadow:inset 0 0 0 1px rgba(0,0,0,.12)}
.rb img{height:24px;width:auto}
.rb.her[aria-pressed="true"]{background:var(--pink);border-color:var(--pink);box-shadow:0 0 0 3px rgba(217,70,127,.22)}
.rb.br{font:700 10px/1.05 var(--body);color:var(--navy);text-align:center}
.rb.br.on{background:var(--navy);color:#fff;border-color:var(--navy)}
.rail .lb{font:700 9px var(--body);letter-spacing:.08em;text-transform:uppercase;color:var(--mute);text-align:center;margin-top:2px}
.viewer{position:relative;min-height:0;min-width:0}
.deck{position:absolute;inset:0}
.scard{position:absolute;inset:0;background:#fff;border-radius:22px;border:2px solid #f3e1e8;box-shadow:0 10px 26px rgba(80,30,60,.16);display:flex;flex-direction:column;overflow:hidden;user-select:none;-webkit-user-select:none;touch-action:none;will-change:transform}
.scard.back{transform:scale(.95) translateY(10px);opacity:.7;touch-action:auto}
.scard .ph{flex:1;min-height:0;position:relative;overflow:hidden;display:flex;align-items:center;justify-content:center;padding:8px;background:#fff}
.scard .ph img{max-width:100%;max-height:100%;object-fit:contain;transform-origin:0 0;pointer-events:none;-webkit-user-drag:none;will-change:transform}
.scard .ph img.photo{border-radius:12px}
.scard .meta{flex:none;display:flex;align-items:center;gap:8px;padding:7px 12px 9px;border-top:2px solid #f6e8ee;min-width:0}
.scard .meta .tx{min-width:0;flex:1}
.scard .meta b{display:block;font:700 16px/1.15 var(--body);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.scard .meta span{display:block;font-size:12px;color:var(--mute);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.scard .meta img.lg{height:26px;width:auto;max-width:76px;object-fit:contain;flex:none}
.scard .hb{position:absolute;left:10px;top:10px;z-index:2;background:rgba(253,232,239,.95);color:#a3285a;border-radius:999px;padding:4px 9px 4px 5px;font:700 11px var(--body);display:flex;align-items:center;gap:4px;pointer-events:none}
.scard .hb img{height:16px;width:auto}
.scard .zb{position:absolute;right:8px;top:8px;z-index:2;display:flex;gap:6px}
.scard .zb button{width:32px;height:32px;border-radius:50%;border:0;background:rgba(36,52,143,.85);color:#fff;font:700 17px var(--body);cursor:pointer;line-height:1}
.stamp{position:absolute;top:22%;z-index:3;padding:3px 12px;border:4px solid;border-radius:10px;font:400 30px 'Alfa Slab One',Georgia,serif;opacity:0;pointer-events:none;background:rgba(255,255,255,.88)}
.stamp.yes{left:16px;color:var(--pink);border-color:var(--pink);transform:rotate(-12deg)}
.stamp.no{right:16px;color:#7a6a85;border-color:#7a6a85;transform:rotate(12deg)}
.zhint{position:absolute;left:50%;bottom:8px;transform:translateX(-50%);background:rgba(42,32,54,.7);color:#fff;font:600 11.5px var(--body);border-radius:999px;padding:4px 10px;white-space:nowrap;pointer-events:none;z-index:2;transition:opacity .4s}
.empty{position:absolute;inset:0;border:2.5px dashed #e3c9d4;border-radius:22px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;text-align:center;padding:18px;color:#8a6a7a;font:600 14px/1.4 var(--body)}
.peekbar{position:absolute;left:0;right:0;top:-2px;z-index:4;display:flex;justify-content:center}
.peekbar span{background:var(--navy);color:#fff;border-radius:0 0 12px 12px;font:700 11px var(--body);letter-spacing:.06em;padding:4px 12px;text-transform:uppercase}
/* actions */
.acts{flex:none;display:flex;justify-content:center;align-items:center;gap:16px;padding-left:56px}
.acts button{border:0;border-radius:50%;cursor:pointer;display:flex;align-items:center;justify-content:center;box-shadow:0 5px 14px rgba(80,30,60,.16);background:#fff;padding:0}
.acts .no{width:54px;height:54px;font-size:24px;color:#7a6a85}
.acts .yes{width:62px;height:62px;font-size:28px;color:#fff;background:var(--pink)}
.acts .undo{width:40px;height:40px;font-size:18px;color:var(--navy)}
.acts button:disabled{opacity:.35;cursor:default}
.acts .pill{border-radius:999px;width:auto;height:46px;padding:0 18px;font:700 14px var(--body)}
.acts .pill.pk{background:var(--pink);color:#fff}
/* tray */
.tray{flex:none;display:flex;align-items:center;gap:8px;background:#fbf4ee;border-radius:18px;padding:7px 8px;min-height:68px}
.tray .tl{flex:none;font:700 10px/1.2 var(--body);letter-spacing:.12em;text-transform:uppercase;color:var(--mute);width:52px;text-align:center}
.tray .tl b{display:block;font:400 22px/1 'Alfa Slab One',Georgia,serif;color:var(--pink);letter-spacing:0}
.tray .th{flex:1;min-width:0;display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;padding:2px}
.tray .th::-webkit-scrollbar{display:none}
.tray .th button{flex:none;width:54px;height:54px;border-radius:12px;border:2px solid #fff;background:#fff;padding:2px;cursor:pointer;position:relative}
.tray .th button img{width:100%;height:100%;object-fit:contain}
.tray .th button[aria-pressed="true"]{border-color:var(--pink);box-shadow:0 0 0 2px rgba(217,70,127,.3)}
.tray .th button .ck{position:absolute;right:-4px;top:-4px;width:18px;height:18px;border-radius:50%;background:var(--pink);color:#fff;font:700 11px/18px var(--body)}
.tray.rk .th button{width:84px}
.tray .go{flex:none;border:0;border-radius:14px;background:var(--pink);color:#fff;font:700 13px/1.15 var(--body);padding:9px 11px;cursor:pointer;max-width:96px}
.tray .go:disabled{opacity:.35;cursor:default}
.tray .none{flex:1;font-size:12.5px;color:var(--mute);line-height:1.3}
/* tiles stage */
.hello{text-align:center;padding:6px 0 2px}
.hello h1{margin:0;font:400 clamp(28px,8.4vw,40px)/1.02 'Alfa Slab One',Georgia,serif;color:var(--navy)}
.hello p{margin:6px auto 0;color:var(--mute);font-size:15px;max-width:36ch;line-height:1.4}
.how{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin:4px 0}
.how div{background:#fbf4ee;border-radius:14px;padding:8px 6px;text-align:center;font:600 11.5px/1.25 var(--body);color:var(--ink)}
.how div b{display:block;font:400 18px 'Alfa Slab One',Georgia,serif;color:var(--pink)}
.tgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;padding-bottom:12px}
.tgrid button{border:2px solid var(--line);background:#fff;border-radius:16px;padding:7px 5px;display:flex;flex-direction:column;align-items:center;gap:4px;font:700 12.5px/1.15 var(--body);cursor:pointer;min-width:0}
.tgrid img{width:88%;aspect-ratio:1;border-radius:50%;object-fit:cover}
.tgrid small{font:500 10.5px var(--body);color:var(--mute)}
/* sheet */
.sheet{position:fixed;inset:0;z-index:40;background:rgba(30,16,30,.45);display:flex;align-items:flex-end;justify-content:center}
.sheet .box{background:#fff;border-radius:22px 22px 0 0;width:100%;max-width:520px;max-height:78dvh;overflow:auto;padding:14px 14px calc(16px + env(safe-area-inset-bottom,0px))}
.sheet h3{margin:2px 0 10px;font:400 22px 'Alfa Slab One',Georgia,serif;color:var(--navy)}
.sheet .bl{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.sheet .bl button{border:2px solid var(--line);background:#fff;border-radius:14px;padding:8px;display:flex;flex-direction:column;align-items:center;gap:4px;cursor:pointer;font:600 12px var(--body);min-height:66px;justify-content:center}
.sheet .bl button img{max-height:30px;max-width:110px;object-fit:contain}
.sheet .bl button[aria-pressed="true"]{border-color:var(--navy);box-shadow:0 0 0 3px rgba(36,52,143,.15)}
.sheet .x{float:right;border:0;background:#f4eaef;border-radius:50%;width:32px;height:32px;cursor:pointer;font-size:15px}
/* match card stage */
.seg{display:grid;grid-auto-flow:column;grid-auto-columns:1fr;background:#fbeef3;border-radius:999px;padding:4px;gap:4px}
.seg button{border:0;border-radius:999px;background:transparent;font:700 13px var(--body);color:#7a2346;padding:9px 6px;cursor:pointer}
.seg button[aria-pressed="true"]{background:var(--pink);color:#fff}
.seg.nv button[aria-pressed="true"]{background:var(--navy)}
.prev{display:flex;justify-content:center}
.prev img{width:100%;max-width:420px;border-radius:14px;box-shadow:0 10px 30px rgba(80,30,60,.18);display:block}
.prev .ld{aspect-ratio:4/5;width:100%;max-width:420px;border-radius:14px;background:#f6e9df;display:flex;align-items:center;justify-content:center;color:var(--mute);font-weight:600}
.big{border:0;border-radius:999px;background:var(--pink);color:#fff;font:700 16px var(--body);padding:14px;cursor:pointer;width:100%}
.big.nv{background:var(--navy)}
.big.gh{background:#fff;color:var(--pink);border:2px solid var(--pink)}
.mailbox{background:#fbf4ee;border-radius:18px;padding:12px;display:grid;gap:8px}
.mailbox h3,.shop h3{margin:0;font:400 20px 'Alfa Slab One',Georgia,serif;color:var(--navy)}
.mailbox p{margin:0;font-size:13.5px;color:var(--mute);line-height:1.4}
.mailbox .row{display:flex;gap:8px}
.mailbox input{flex:1;min-width:0;border:2px solid var(--line);border-radius:12px;padding:11px 12px;font:500 15px var(--body)}
.mailbox .row button{border:0;border-radius:12px;background:var(--navy);color:#fff;font:700 14px var(--body);padding:0 14px;cursor:pointer}
.mailbox .ok{font-size:13px;color:#7a2346;background:#fde8ef;border-radius:10px;padding:8px 10px}
.shop{display:grid;gap:6px}
.si{display:flex;align-items:center;gap:10px;border-top:1px solid #f3e4ea;padding:8px 0}
.si img{width:46px;height:46px;object-fit:contain;flex:none}
.si .tx{flex:1;min-width:0}.si .tx b{display:block;font:700 14px/1.2 var(--body)}.si .tx small{color:var(--mute);font-size:12px}
.si a.go{background:var(--navy);color:#fff;border-radius:999px;padding:8px 14px;font:700 13px var(--body);text-decoration:none;white-space:nowrap}
.si a.dc{display:block;font-size:11.5px;color:var(--pink);font-weight:700;margin-top:2px}
.lnk{border:0;background:none;color:var(--pink);font:700 14px var(--body);text-decoration:underline;cursor:pointer;padding:8px;display:block;margin:0 auto}
.hint{font-size:12.5px;color:var(--mute);text-align:center;margin:0}
.toast{position:fixed;left:50%;bottom:110px;transform:translateX(-50%);background:var(--ink);color:#fff;border-radius:999px;padding:8px 14px;font:600 13px var(--body);z-index:50;pointer-events:none}

/* v3: steps down the page */
#app{height:auto;min-height:100dvh;overflow:visible}
.top{position:sticky;top:0;z-index:20;background:rgba(255,255,255,.96);backdrop-filter:blur(8px);border-bottom:1px solid #f6e8ee}
.stp{margin-left:auto;display:flex;gap:4px}
.stp button{border:0;background:#fbeef3;color:#7a2346;border-radius:999px;padding:5px 9px 5px 5px;font:700 11.5px var(--body);display:flex;align-items:center;gap:4px;cursor:pointer}
.stp button b{width:18px;height:18px;border-radius:50%;background:var(--pink);color:#fff;font-size:10.5px;display:flex;align-items:center;justify-content:center}
.stp button:disabled{opacity:.4;cursor:default}
#stage{display:block;padding:0 12px 40px;overflow:visible}
.sec{display:flex;flex-direction:column;gap:10px;scroll-margin-top:60px}
.sec:not(:empty){padding:14px 0 22px}
.sec+.sec:not(:empty){border-top:2px dashed #f1dbe4}
.sh{display:flex;gap:10px;align-items:flex-start}
.sh .num,.picked .num{flex:none;width:30px;height:30px;border-radius:50%;background:var(--pink);color:#fff;font:400 16px 'Alfa Slab One',Georgia,serif;display:flex;align-items:center;justify-content:center}
.sh h2{margin:0;font:400 clamp(26px,7.4vw,34px)/1 'Alfa Slab One',Georgia,serif;color:var(--navy)}
.sh p{margin:4px 0 0;color:var(--mute);font-size:14px;line-height:1.35}
.picked{display:flex;align-items:center;gap:10px;background:#fbf4ee;border-radius:18px;padding:8px 10px}
.picked img{width:56px;height:56px;border-radius:12px;object-fit:cover}
.picked .tx{flex:1;min-width:0}.picked i{display:block;font:700 10px var(--body);letter-spacing:.2em;text-transform:uppercase;color:var(--mute);font-style:normal}.picked b{display:block;font:400 22px/1.05 'Alfa Slab One',Georgia,serif;color:var(--navy)}.picked small{color:var(--mute);font-size:12px}
.tgrid button[aria-pressed="true"]{border-color:var(--pink);box-shadow:0 0 0 3px rgba(217,70,127,.25)}
.chip{border:2px solid var(--line);background:#fff;border-radius:999px;padding:7px 12px;font:700 13px var(--body);color:var(--navy);cursor:pointer;display:inline-flex;align-items:center;gap:6px;white-space:nowrap}
.chip img{height:18px;width:auto}
.chip.her{color:var(--pink);border-color:#f2c2d4}
.chip.her[aria-pressed="true"]{background:var(--pink);color:#fff;border-color:var(--pink)}
.chip.on{background:var(--navy);color:#fff;border-color:var(--navy)}
.chip.mini{padding:4px 10px;font-size:12px}
.fbar{display:flex;gap:8px;flex-wrap:wrap}
.dots{display:flex;gap:6px;align-items:center;overflow-x:auto;scrollbar-width:none;padding:2px}
.dots::-webkit-scrollbar{display:none}
.dot{flex:none;width:34px;height:34px;border-radius:50%;border:2px solid var(--line);background:#fff;padding:0;display:flex;align-items:center;justify-content:center;cursor:pointer}
.dot i{width:22px;height:22px;border-radius:50%;display:block;box-shadow:inset 0 0 0 1px rgba(0,0,0,.12)}
.dot[aria-pressed="true"]{border-color:var(--navy);box-shadow:0 0 0 3px rgba(36,52,143,.18)}
.dlab{flex:none;font:600 12.5px var(--body);color:var(--mute);padding-left:4px}
.shrow{display:flex;align-items:center;justify-content:space-between;gap:8px}
.seg.mode{flex:none;padding:3px}.seg.mode button{padding:7px 10px;font-size:12px}
.frow{display:flex;gap:6px;align-items:center;overflow-x:auto;scrollbar-width:none;padding:2px;margin:0 -12px;padding:2px 12px}
.frow::-webkit-scrollbar{display:none}.frow .chip{flex:none;padding:6px 10px}.frow .sep{flex:none;width:1px;height:24px;background:var(--line)}
.cmp{display:flex;flex-direction:column;gap:0}
.tilev{position:relative;overflow:hidden;border-radius:18px 18px 0 0;aspect-ratio:16/10;background:#fff;touch-action:pan-y;user-select:none;-webkit-user-select:none}
.tilev img{position:absolute;left:0;top:0;width:100%;height:auto;transform-origin:0 0;pointer-events:none;-webkit-user-drag:none}
.tilev .zb{position:absolute;right:8px;top:8px;z-index:2;display:flex;gap:6px}
.tilev .zb button,.scard .zb button{width:32px;height:32px;border-radius:50%;border:0;background:rgba(36,52,143,.85);color:#fff;font:700 17px var(--body);cursor:pointer;line-height:1}
.tcap{display:flex;justify-content:space-between;gap:8px;background:#2a2036;color:#fff;font:600 11.5px var(--body);padding:5px 12px;letter-spacing:.02em}
.tcap span:last-child{opacity:.7}
.deck{position:relative}
.deck.m{height:min(calc(100vw - 24px + 54px),550px)}
.cmp.aer .deck.m{height:min(calc(100vw - 24px + 54px),550px)}
.cmp .tilev+.tcap+.deck .scard{border-radius:0 0 22px 22px;border-top:0}
.deck.r{height:min(56vw,250px)}
.scard{touch-action:none}
.scard.back{touch-action:none}
.scard.rk .ph{padding:14px 18px}
.onmat{position:absolute;left:50%;top:50%;width:34%;aspect-ratio:1;object-fit:cover;border-radius:50%;transform:translate(-50%,-50%);border:5px solid #fff;box-shadow:0 8px 20px rgba(0,0,0,.25);pointer-events:none}
.matv{position:relative;background:#fff;border:2px solid #f3e1e8;border-top:0;height:min(80vw,380px);display:flex;align-items:center;justify-content:center;padding:10px}
.matv img{max-width:100%;max-height:100%;object-fit:contain}
.matv img.photo{border-radius:12px}
.matv .chip{position:absolute;right:8px;top:8px}
.cmp .matv+.deck .scard{border-radius:0 0 22px 22px}
.acts{padding-left:0}

/* brand pass (Oct 12): flame in the bar, colour-card lockup on top */
.top img{height:30px;width:auto}
.lock{background:var(--cream);border-radius:24px;padding:18px 14px 16px;text-align:center;display:flex;flex-direction:column;gap:4px}
.lock .eb{font:700 12px var(--body);letter-spacing:.3em;text-transform:uppercase;color:var(--ink)}
.lock .ttl{margin:0;font:400 clamp(38px,11.5vw,64px)/.95 'Alfa Slab One',Georgia,serif;text-transform:uppercase;color:var(--pink);text-shadow:3px 3px 0 #fff}
.lock .by{font:italic 500 clamp(16px,4.4vw,20px)/1.3 'Playfair Display',Georgia,serif;color:#3a2f4d;margin-top:4px}
.how div{font-family:var(--body)}
.chip.her{color:var(--pink)}

/* phone fit (Oct 13): whole swipe step (filters, tiles, mat, buttons) fits one phone screen */
@media (max-width:560px){.tilev{aspect-ratio:16/7}.deck.m,.cmp.aer .deck.m{height:min(calc(100vw - 24px + 54px),calc(100dvh - 372px),550px);min-height:200px}.deck.r{height:min(50vw,220px)}.sec:not(:empty){padding:10px 0 18px}.sh p{margin-top:2px}}

.msearch{position:relative;margin:6px 0 8px}
.msearch input{width:100%;box-sizing:border-box;font:inherit;font-size:16px;padding:10px 14px;border:1.5px solid #e3c9cf;border-radius:999px;background:#fff;color:#3a2a2e;outline:none}
.msearch input:focus{border-color:#a3192e}
.msr{position:absolute;left:0;right:0;top:calc(100% + 4px);background:#fff;border-radius:14px;box-shadow:0 8px 24px rgba(0,0,0,.15);z-index:30;max-height:330px;overflow:auto}
.msr:empty{display:none}
.msr button{display:flex;gap:10px;align-items:center;width:100%;border:0;background:none;padding:8px 10px;text-align:left;font:inherit;cursor:pointer;color:#3a2a2e}
.msr button:hover,.msr button:focus{background:#fbeff1}
.msr img{width:44px;height:44px;object-fit:cover;border-radius:8px;flex:none;background:#f3f3f3}
.msr b{display:block;font-size:14px;line-height:1.2}.msr small{color:#8a7579;font-size:12px}
.msr .none{padding:12px;font-size:14px;color:#8a7579}

.tsort{display:flex;gap:6px;justify-content:center;margin:4px 0 10px}
.tsort button{font:inherit;font-size:13px;padding:6px 14px;border-radius:999px;border:1.5px solid #e3c9cf;background:#fff;color:#3a2a2e;cursor:pointer}
.tsort button[aria-pressed=true]{background:#a3192e;border-color:#a3192e;color:#fff}
.tgrp{grid-column:1/-1;display:flex;align-items:center;gap:8px;margin:10px 2px 2px;font-weight:700;font-size:14px;color:#3a2a2e}
.tgrp i{width:14px;height:14px;border-radius:50%;display:inline-block}

.tchips{text-align:center;margin:6px 0 12px}.tchips p{font-size:12px;letter-spacing:.14em;text-transform:uppercase;font-weight:700;margin:0 0 8px;color:#3a2a2e}
.tchips button{font:inherit;font-weight:700;font-size:14px;margin:4px 3px;padding:7px 14px;border-radius:999px;border:2px solid var(--c);background:#fff;color:#1f3a6b;cursor:pointer}
.tchips button[aria-pressed=true]{background:var(--c);color:#fff}

<body>
<div id="app"><header class="top"><img id="logo" alt="Mahj Matchmaker"><nav class="stp" id="stp" aria-label="Steps"></nav></header><main id="stage"><section id="s-tiles" class="sec"></section><section id="s-mats" class="sec"></section><section id="s-racks" class="sec"></section><section id="s-card" class="sec"></section></main></div>
<!--BUNDLES-->

<script>
const D=__DATA__;
const IMG=window.IMG||{};const M=D.mats,R=D.racks,T=D.tiles,UNI=D.uni;
const LG=k=>D.logos[k]?IMG[D.logos[k]]:'';
const $=id=>document.getElementById(id);
const esc=s=>String(s==null?'':s).replace(/[&<>"]/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[m]));
const FAMS=['pink','red','orange','yellow','green','blue','purple','neutral','dark'];
const FAMN={pink:'Pink',red:'Red',orange:'Orange & coral',yellow:'Yellow & gold',green:'Green',blue:'Blue & teal',purple:'Purple',neutral:'Neutral',dark:'Brown & black'};
const FAMC={pink:'#e57aa3',red:'#c8283c',orange:'#e8741f',yellow:'#d4a20f',green:'#3c9a55',blue:'#2f6fc8',purple:'#8a4fc0',neutral:'#e2d3b8',dark:'#4a3426'};
const RAINBOW='conic-gradient(#d6247f,#e8741f,#d49a00,#2f9a55,#12968f,#2f55c8,#8a4fc0,#d6247f)';
const S={step:'tiles',set:null,fam:'',brand:'',her:false,seen:{},liked:[],hist:[],peek:null,fav:null,rseen:{},rliked:[],rhist:[],rpick:[],view:'tri',fmt:'fb',hinted:false};
const set=()=>D.sets[S.set];
const herMat=id=>set().m.some(x=>x[0]===id);
const herRacks=()=>{const x=set().m.find(x=>x[0]===S.fav);return x?x[1]:[];};
const MC={},MCP={},MCN=12;const mcOf=f=>Math.floor(parseInt(f.split('/')[1])/MCN);
function loadMC(f){const c=mcOf(f);if(MCP[c])return MCP[c];MCP[c]=fetch('mc/'+c+'.json').then(r=>r.json()).then(o=>{const sw={};for(const k in o){MC[k]=o[k];}for(const id in M){const ff=M[id].f;if(o[ff])sw[IMG[M[id].th]]=o[ff];}document.querySelectorAll('img').forEach(i=>{const n=sw[i.getAttribute('src')];if(n)i.src=n;});}).catch(()=>{delete MCP[c];});return MCP[c];}
const matFull=id=>MC[M[id].f]?Promise.resolve(MC[M[id].f]):loadMC(M[id].f).then(()=>MC[M[id].f]||IMG[M[id].th]);
const matSrc=id=>{const f=M[id].f;if(MC[f])return MC[f];loadMC(f);return IMG[M[id].th];}, matTh=id=>IMG[M[id].th], rackSrc=id=>IMG[R[id].im], pile=s=>IMG[T[s.tile].pile];
const shortR=id=>{const r=R[id],b=r.bn||'';return b&&r.n.startsWith(b)?(r.n.slice(b.length).trim()||r.n):r.n;};
function hex2lab(h){let [r,g,b]=[1,3,5].map(i=>parseInt(h.slice(i,i+2),16)/255).map(v=>v>.04045?Math.pow((v+.055)/1.055,2.4):v/12.92);let x=(r*.4124+g*.3576+b*.1805)/.95047,y=r*.2126+g*.7152+b*.0722,z=(r*.0193+g*.1192+b*.9505)/1.08883;const f=t=>t>.008856?Math.cbrt(t):7.787*t+16/116;x=f(x);y=f(y);z=f(z);return [116*y-16,500*(x-y),200*(y-z)];}
/* ---------- v3: steps down the page ---------- */
S.f={m:{fam:'',brand:'',her:false},r:{fam:'',brand:'',her:false}};S.mode='close';S.tilesOpen=true;S.made=false;
const tileFull=s=>T[s.tile].full||pile(s);
function matPool(){return set().rank.map(i=>D.order[i]).filter(id=>M[id]&&(!M[id].rt||herMat(id)));}
function matDeck(){const f=S.f.m;let ids=matPool();if(f.her)ids=ids.filter(herMat);if(f.fam)ids=ids.filter(id=>M[id].mf.includes(f.fam));if(f.brand)ids=ids.filter(id=>M[id].bn===f.brand);return ids;}
function rackPool(){const hr=herRacks();const sw=(M[S.fav].ms||[]).filter(s=>s[1]>=.06).map(s=>hex2lab(s[0]));
 const sc=r=>{const h=R[r].hx;if(!h||!sw.length)return 99;const L=hex2lab(h);return Math.min(...sw.map(s=>Math.hypot(L[0]-s[0],L[1]-s[1],L[2]-s[2])));};
 const rest=Object.keys(R).filter(r=>!hr.includes(r)&&!UNI.includes(r)&&!R[r].rt).map(r=>[sc(r),r]).sort((a,b)=>a[0]-b[0]).map(x=>x[1]);
 return [...new Set([...hr,...UNI,...rest])];}
function rackDeck(){const f=S.f.r,hr=herRacks();let ids=rackPool();if(f.her)ids=ids.filter(r=>hr.includes(r)||UNI.includes(r));if(f.fam)ids=ids.filter(r=>R[r].rf.includes(f.fam));if(f.brand)ids=ids.filter(r=>R[r].bn===f.brand);return ids;}
function queue(k){const seen=k==='m'?S.seen:S.rseen;return (k==='m'?matDeck():rackDeck()).filter(id=>!seen[id]);}
const icon=()=>LG('icon')?`<img src="${LG('icon')}" alt="">`:'♥';
function head(n,t,p){return `<div class="sh"><span class="num">${n}</span><div><h2>${t}</h2>${p?`<p>${p}</p>`:''}</div></div>`;}
function filters(k){const f=S.f[k];const pool=k==='m'?matPool():rackPool();const fk=k==='m'?(id=>M[id].mf):(id=>R[id].rf);const fams=FAMS.filter(x=>pool.some(id=>fk(id).includes(x)));
 return `<div class="frow" role="group" aria-label="Filters"><button type="button" class="chip her" data-her="${k}" aria-pressed="${f.her}">${icon()} Tiffany\u2019s</button><button type="button" class="chip${f.brand?' on':''}" data-brands="${k}">${f.brand?esc(f.brand)+' \u2715':'Brand \u25be'}</button><span class="sep"></span><button type="button" class="dot" data-fam="" data-k="${k}" aria-pressed="${!f.fam}" title="All colors" aria-label="All colors"><i style="background:${RAINBOW}"></i></button>${fams.map(x=>`<button type="button" class="dot" data-fam="${x}" data-k="${k}" aria-pressed="${f.fam===x}" title="${FAMN[x]}" aria-label="${FAMN[x]}"><i style="background:${FAMC[x]}"></i></button>`).join('')}</div>`;}
function card(id,k,back){const mat=k==='m';const o=mat?M[id]:R[id];const her=mat?herMat(id):(herRacks().includes(id)||UNI.includes(id));
 const src=mat?matSrc(id):rackSrc(id);const lg=LG(o.bn);const aer=mat&&S.mode==='aerial';
 return `<div class="scard${back?' back':''}${mat?'':' rk'}" ${back?'':`id="top-${k}"`} data-id="${esc(id)}"><div class="ph"><img src="${src}" alt="${esc(o.n)}" class="${o.c?'':'photo'}" draggable="false">${aer?`<img class="onmat" src="${pile(set())}" alt="" draggable="false">`:''}</div>
 <div class="meta">${lg?`<img class="lg" src="${lg}" alt="">`:''}<div class="tx"><b>${esc(mat?o.n:shortR(id))}</b><span>${esc(o.bn)}${o.rt?' · retired':''}${!mat&&UNI.includes(id)?' · goes with everything':''}</span></div></div>
 ${her?`<span class="hb">${icon()} ${!mat&&UNI.includes(id)&&!herRacks().includes(id)?'Goes with everything':'Tiffany’s match'}</span>`:''}
 ${back?'':`${mat&&!aer?'<div class="zb"><button type="button" data-z="-1" aria-label="Zoom out">−</button><button type="button" data-z="1" aria-label="Zoom in">+</button></div>':''}<span class="stamp yes">CRUSH</span><span class="stamp no">NEXT</span>`}</div>`;}
function deck(k){const q=queue(k);
 if(k==='m'&&S.peek)return `<div class="deck m"><div class="peekbar"><span>Your suitor</span></div>${card(S.peek,k)}</div>`;
 if(!q.length&&S.f[k].her)return `<div class="deck ${k}"><div class="empty">That’s every ${k==='m'?'mat':'rack'} that fits your current filters with <b>Tiffany’s matches on</b>. To see all the possibilities, turn Tiffany’s matches off.<button type="button" class="big gh" style="width:auto;padding:10px 16px" data-her="${k}">Turn Tiffany’s matches off</button></div></div>`;
 if(!q.length)return `<div class="deck ${k}"><div class="empty">${k==='m'?'That’s every mat that fits these filters.':'That’s every rack that fits these filters.'}<button type="button" class="big gh" style="width:auto;padding:10px 16px" data-clear="${k}">Loosen your standards</button></div></div>`;
 return `<div class="deck ${k}">${q[1]?card(q[1],k,true):''}${card(q[0],k)}</div>`;}
function acts(k){if(k==='m'&&S.peek)return `<div class="acts"><button type="button" class="pill" data-unpeek>‹ Keep swiping</button><button type="button" class="pill pk" data-mock="${esc(S.peek)}">Mock this match ♥</button></div>`;
 const q=queue(k),h=k==='m'?S.hist:S.rhist;return `<div class="acts"><button type="button" class="undo" data-undo="${k}" aria-label="Undo" ${h.length?'':'disabled'}>↺</button><button type="button" class="no" data-no="${k}" aria-label="Pass" ${q.length?'':'disabled'}>✕</button><button type="button" class="yes" data-yes="${k}" aria-label="Crush" ${q.length?'':'disabled'}>♥</button></div>`;}
function tray(k){if(k==='m'){const L=S.liked;return `<div class="tray"><div class="tl"><b>${L.length}</b>${L.length===1?'suitor':'suitors'}</div>${L.length?`<div class="th" id="th">${L.slice().reverse().map(id=>`<button type="button" data-peek="${esc(id)}" aria-pressed="${S.peek===id}" aria-label="${esc(M[id].n)}"><img src="${matTh(id)}" alt=""></button>`).join('')}</div><button type="button" class="go" data-mock="${esc(S.peek||L[L.length-1])}">Mock your match ›</button>`:'<div class="none">Swipe right on mats you like. They’ll wait here so you can compare.</div>'}</div>`;}
 const L=S.rliked;return `<div class="tray rk"><div class="tl"><b>${S.rpick.length}</b>of 2 picked</div>${L.length?`<div class="th">${L.slice().reverse().map(id=>`<button type="button" data-rp="${esc(id)}" aria-pressed="${S.rpick.includes(id)}" aria-label="${esc(R[id].n)}"><img src="${rackSrc(id)}" alt="">${S.rpick.includes(id)?'<span class="ck">✓</span>':''}</button>`).join('')}</div>`:'<div class="none">Swipe right on racks, then tap up to 2 here.</div>'}<button type="button" class="go" data-make ${S.rpick.length?'':'disabled'}>Make it official ♥</button></div>`;}
function tileView(cls){const s=set();return `<div class="tilev ${cls||''}" id="tv-${cls||'m'}"><img src="${tileFull(s)}" alt="${esc(s.name)} tiles" draggable="false"><div class="zb"><button type="button" data-tz="-1" aria-label="Zoom out">−</button><button type="button" data-tz="1" aria-label="Zoom in">+</button></div></div>`;}
/* ---------- sections ---------- */
const BACKG={"Holiday":["Dear Santa","Rackin' Rudolph","Holly Jolly (Rudolph Red)","Holly Jolly (Grinch Green)","Holly Jolly (Sugarplum Pink)","Tinselle (Ruby Red)","Tinselle (Emerald Green)","Nivalee (Glacier Blue)","Nutcracker Ballet","Après Ski Club"],"Red":["Nantucket"],"Pink":["Amara","Coquette","Dandy","Glitterville","La Fete","Glow Wild"],"Yellow & Orange":["Solara","Sierra","Sunset","Classic Tortoise","Pippa","Sorbet"],"Green":["Limoncello","Drake","Emerald","Jasmine","Miss Classic Jade","Miss Classic Malachite","Palm Royale","Willow"],"Blue":["Birdie","Gatsby","Lagoon","Lola","Moonlight","Osler","Seabreeze"],"Purple":["Gemma","Luminaire","Taylor"],"Brown":["Heritage 1.0","Heritage 2.0","Cypress","Smith"],"Ivory":["Pearlescent","Talulah"],"Natural Patterns":["Heritage 1.0","Heritage 2.0","Cypress","Smith","Classic Tortoise","Talulah","Pearlescent","Palm Royale","Emerald","Miss Classic Jade","Miss Classic Malachite"]};
/* Holiday group: first during the holiday season; set HOLIDAY_SEASON=false to push it to the bottom */
const HOLIDAY_SEASON=true;
const GDOT={Holiday:'linear-gradient(135deg,#c8202f 50%,#1f6b3a 50%)',Red:'#c8202f',Pink:'#e2558f',Orange:'#e07a2e',Yellow:'#e9c531',Green:'#3f9a52',Blue:'#3b6fc4',Purple:'#7d55b0',Ivory:'#efe6d2',Brown:'#7a4a2a','Natural Pattern':'linear-gradient(135deg,#8a5a2b,#d9b77e 45%,#2f6b4f 55%,#e8dfcf)'};
function tileBtn(s,i){return `<button type="button" data-tile="${i}" aria-pressed="${S.set===i}"><img src="${pile(s)}" alt="" loading="lazy"><span>${esc(s.name)}</span><small>${esc(s.maker)}</small></button>`;}
function tileOrder(){const ORD=Object.keys(BACKG).filter(g=>g!=='Holiday');if(HOLIDAY_SEASON)ORD.unshift('Holiday');else ORD.push('Holiday');return ORD;}
function tileChips(){if(!S.tcol)S.tcol=tileOrder()[0];return tileOrder().map(g=>`<button type="button" data-tcol="${g}" aria-pressed="${S.tcol===g}" style="--c:${GCHIP[g]||'#3a2a2e'}">${g==='Holiday'?'Holiday':g}</button>`).join('')+`<button type="button" data-tcol="az" aria-pressed="${S.tcol==='az'}" style="--c:#1f3a6b">All A–Z</button>`;}
function tileGrid(){const all=D.sets.map((s,i)=>[s,i]);if(!S.tcol)S.tcol=tileOrder()[0];
 if(S.tcol==='az')return all.sort((a,b)=>a[0].name.localeCompare(b[0].name)).map(([s,i])=>tileBtn(s,i)).join('');
 return (BACKG[S.tcol]||[]).map(n=>all.find(x=>x[0].name===n)).filter(Boolean).map(([s,i])=>tileBtn(s,i)).join('');}
const GCHIP={Holiday:'#a3192e',Red:'#c8343c',Pink:'#d6568a',Orange:'#e07a2e','Yellow & Orange':'#e08a2e',Green:'#3f8f55',Blue:'#3f6fb5',Purple:'#7d55b0',Brown:'#7a4a2a',Ivory:'#b9a57a','Natural Patterns':'#8a6a3a'};
function renderTiles(){const el=$('s-tiles');
 if(S.set!=null&&!S.tilesOpen){const s=set();el.innerHTML=`<div class="picked"><span class="num">1</span><img src="${pile(s)}" alt=""><div class="tx"><i>Your tiles</i><b>${esc(s.name)}</b><small>${esc(s.maker)}</small></div><button type="button" class="chip" data-opentiles>Change</button></div>`;return;}
 el.innerHTML=`<div class="lock"><div class="eb">mahjmatchmaker.com</div><h1 class="ttl">Find Your Match</h1><div class="by">Single &amp; ready to mingle? Pick the tiles you’re bringing to the table.</div></div><div class="how"><div><b>1</b>Swipe on mats</div><div><b>2</b>Pick your crush</div><div><b>3</b>Add racks</div></div><div class="tchips" role="group" aria-label="Shop tiles by color"><p>Shop by color</p>${tileChips()}</div><div class="tgrid">${tileGrid()}</div>`;}
function renderMats(){const el=$('s-mats');if(S.set==null){el.innerHTML='';return;}const s=set();
 el.innerHTML=`<div class="shrow">${head(2,'Mat-ching','Right = crush, left = pass')}<div class="seg mode" role="group" aria-label="View"><button type="button" data-mode="close" aria-pressed="${S.mode==='close'}">Up close</button><button type="button" data-mode="aerial" aria-pressed="${S.mode==='aerial'}">Aerial</button></div></div>`+`<div class="msearch"><input id="msq" type="search" enterkeyhint="search" placeholder="Already own a mat? Search by name or brand" autocomplete="off" aria-label="Search mats"><div id="msr" class="msr" role="listbox"></div></div>`+filters('m')+
 (S.mode==='close'?`<div class="cmp">${tileView('m')}<div class="tcap"><span>${esc(s.name)} tiles</span><span>Pinch either photo to zoom</span></div>${deck('m')}</div>`:`<div class="cmp aer">${deck('m')}</div>`)+acts('m')+tray('m');
 bindCard('m');if(S.mode==='close')bindTile('tv-m');preload();}
function renderRacks(){const el=$('s-racks');if(!S.fav){el.innerHTML='';return;}const m=M[S.fav];
 el.innerHTML=head(3,'Love triangle','Every couple needs a wingman. Swipe on racks.')+filters('r')+
 `<div class="cmp">${tileView('r')}<div class="matv"><img src="${matSrc(S.fav)}" alt="${esc(m.n)}" class="${m.c?'':'photo'}"><button type="button" class="chip mini" data-back-mats>Change mat</button></div>${deck('r')}</div>`+acts('r')+tray('r');
 bindCard('r');bindTile('tv-r');}
function renderAll(){renderTiles();renderMats();renderRacks();if(S.made)renderCard();else $('s-card').innerHTML='';steps();}
function steps(){const st=[['s-tiles','Tiles',true],['s-mats','Mats',S.set!=null],['s-racks','Racks',!!S.fav],['s-card','Card',S.made]];
 $('stp').innerHTML=st.map(([id,l,on],i)=>`<button type="button" data-jump="${id}" ${on?'':'disabled'}><b>${i+1}</b>${l}</button>`).join('');}
function jump(id){requestAnimationFrame(()=>{let el=$(id);if(!el)return;if(innerWidth<=560&&(id==='s-mats'||id==='s-racks')){const f=el.querySelector('.cmp');if(f)el=f.previousElementSibling||f;}const y=el.getBoundingClientRect().top+window.scrollY-62;window.scrollTo({top:Math.max(0,y),behavior:'smooth'});});}
function preload(){queue('m').slice(1,4).forEach(id=>{const i=new Image();i.src=matSrc(id);});}
/* ---------- zoom (shared) + swipe ---------- */
function zoomer(host,img,box,opt){opt=opt||{};let z={s:1,x:0,y:0};
 const apply=a=>{img.style.transition=a?'transform .2s':'none';img.style.transform=`translate(${z.x}px,${z.y}px) scale(${z.s})`;host.style.touchAction=(z.s>1||opt.swipe)?'none':'pan-y';};
 const clamp=()=>{const r=box.getBoundingClientRect(),w=img.offsetWidth,h=img.offsetHeight,ox=img.offsetLeft,oy=img.offsetTop;
  if(w*z.s<=r.width)z.x=(r.width-w*z.s)/2-ox;else z.x=Math.min(-ox,Math.max(r.width-(ox+w*z.s),z.x));
  if(h*z.s<=r.height)z.y=(r.height-h*z.s)/2-oy;else z.y=Math.min(-oy,Math.max(r.height-(oy+h*z.s),z.y));};
 const zoomAt=(ns,cx,cy,a)=>{ns=Math.max(1,Math.min(4,ns));const r=box.getBoundingClientRect(),ox=img.offsetLeft,oy=img.offsetTop;
  const px=(cx-r.left-ox-z.x)/z.s,py=(cy-r.top-oy-z.y)/z.s;z.x=cx-r.left-ox-px*ns;z.y=cy-r.top-oy-py*ns;z.s=ns;if(ns===1&&!opt.cover){z.x=0;z.y=0;}clamp();apply(a);};
 const init=()=>{if(opt.cover){clamp();}apply(false);};if(img.complete)init();else img.addEventListener('load',init);
 host.querySelectorAll('[data-z],[data-tz]').forEach(b=>{b.addEventListener('pointerdown',e=>e.stopPropagation());b.addEventListener('click',e=>{e.stopPropagation();const r=box.getBoundingClientRect();zoomAt(z.s*((b.dataset.z||b.dataset.tz)>0?1.6:1/1.6),r.left+r.width/2,r.top+r.height/2,true);});});
 const pts=new Map();let st=null,pinch=null,last=0,dx=0,lock=null;const sw=opt.swipe;
 host.addEventListener('pointerdown',e=>{pts.set(e.pointerId,{x:e.clientX,y:e.clientY});try{host.setPointerCapture(e.pointerId);}catch(_){}
  if(pts.size===2&&opt.zoom!==false){const [a,b]=[...pts.values()];pinch={d:Math.hypot(a.x-b.x,a.y-b.y),s:z.s};st=null;host.style.transform='';return;}
  st={x:e.clientX,y:e.clientY,zx:z.x,zy:z.y,py:e.clientY};dx=0;lock=null;host.style.transition='none';
  const n=Date.now();if(opt.zoom!==false&&n-last<280){zoomAt(z.s>1?1:2.4,e.clientX,e.clientY,true);st=null;last=0;}else last=n;});
 host.addEventListener('pointermove',e=>{if(!pts.has(e.pointerId))return;pts.set(e.pointerId,{x:e.clientX,y:e.clientY});

async function share(){if(!cardURL)return;const name=`${set().slug}-match-${S.fmt==='fb'?'facebook':'pinterest'}.jpg`;let blob;
 try{blob=await (await fetch(cardURL)).blob();}catch(e){toast('Press and hold the picture to save it');return;}
 try{const f=new File([blob],name,{type:'image/jpeg'});if(navigator.canShare&&navigator.canShare({files:[f]})){await navigator.share({files:[f],title:'My mahjong match',text:'Matched on www.mahjmatchmaker.com'});return;}}catch(e){if(e&&e.name==='AbortError')return;}
 if(window.claude&&claude.use){try{const dl=await claude.use('downloads');if(dl){await dl.save({filename:name,data:blob});toast('Match card saved');return;}}catch(e){if(e&&e.code==='declined')return;}toast('Press and hold the picture to save it');return;}
 try{const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=name;document.body.appendChild(a);a.click();a.remove();}catch(e){toast('Press and hold the picture to save it');}}
