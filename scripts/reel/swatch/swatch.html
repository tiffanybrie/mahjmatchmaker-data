<!doctype html><html><head><meta charset="utf-8"><style>
@font-face{font-family:Alfa;src:url(file:///tmp/cc/f/fontsource-alfa-slab-one-5.3.0/package/files/alfa-slab-one-latin-400-normal.woff2)}
@font-face{font-family:Bitter;font-weight:700;src:url(file:///tmp/cc/f/fontsource-bitter-5.3.0/package/files/bitter-latin-700-normal.woff2)}
@font-face{font-family:Play;font-style:italic;src:url(file:///tmp/cc/f/fontsource-playfair-display-5.3.0/package/files/playfair-display-latin-700-italic.woff2)}
*{box-sizing:border-box;margin:0}
body{width:1080px;height:1920px;overflow:hidden;position:relative;font-family:Bitter;background:#f7f0e8}
.abs{position:absolute}
.big{font-family:Alfa;text-align:center;width:1080px;left:0;text-shadow:5px 5px 0 #fff}
.it{font-family:Play;font-style:italic;text-align:center;width:1080px;left:0}
#pile{left:340px;top:1440px;width:400px;height:400px;border-radius:50%;overflow:hidden;border:14px solid var(--c);box-shadow:0 14px 30px rgba(0,0,0,.25)}
#pile img{width:100%;height:100%;object-fit:cover}
.chip{position:absolute;width:250px;height:350px;background:#fff;border-radius:10px;box-shadow:0 12px 26px rgba(0,0,0,.22);padding:14px}
.chip .sw{width:222px;height:230px;border-radius:4px}
.chip b{display:block;font:700 28px Bitter;color:#2a2036;margin-top:12px;white-space:nowrap}
.chip i{display:block;font:italic 26px Play;color:#6b5a77}
#bigchip{left:60px;top:150px;width:960px;height:300px;border-radius:16px;box-shadow:0 14px 30px rgba(0,0,0,.25);overflow:hidden;background:#fff}
#bigchip .sw{position:absolute;left:0;top:0;width:620px;height:300px}
#bigchip .tx{position:absolute;left:650px;top:40px;width:290px}
#bigchip .tx div{font:italic 34px Play;color:#6b5a77}
#bigchip .tx b{display:block;font:44px Alfa;color:#2a2036;line-height:1.05;margin:6px 0}
#bigchip .tx span{font:700 26px Bitter;color:#6b5a77;letter-spacing:2px}
#card{left:130px;top:520px;width:820px;height:1025px;border-radius:20px;box-shadow:0 18px 40px rgba(0,0,0,.28);overflow:hidden;background:#fff}
#card img{width:100%;height:100%;display:block}
#lbl{left:0;top:1590px;width:1080px;text-align:center;font:700 62px Bitter;color:#2a2036}
#lbl small{display:block;font-family:Play;font-style:italic;font-size:46px;color:#6b5a77;font-weight:400}
.heart{position:absolute;width:150px;height:140px}
</style></head><body style="--c:__COL__">
<div id="intro" class="abs" style="inset:0">
 <div class="abs it" style="top:210px;font-size:96px;color:#6b5a77">__TILE_T__&rsquo;s</div>
 <div class="abs big" style="top:330px;font-size:180px;color:var(--c)">COLOR</div>
 <div class="abs big" style="top:520px;font-size:180px;color:var(--c)">STORY</div>
 <div class="abs it" style="top:760px;font-size:58px;color:#2a2036">__NC__ colors hiding in these tiles&hellip;</div>
 <div class="abs it" style="top:840px;font-size:58px;color:#2a2036">and the mat that brings each one out</div>
 <div id="pile" class="abs"><img src="__PILE__"></div>
 <div id="fan"></div>
</div>
<div id="main" class="abs" style="inset:0">
 <div id="bigchip" class="abs"><div class="sw" id="bsw"></div><div class="tx"><div id="bnum"></div><b id="bname"></b><span>FROM THE TILES</span></div></div>
 <div id="card" class="abs"><img id="cimg"></div>
 <div id="lbl" class="abs"></div>
</div>
<div id="end" class="abs" style="inset:0">
 <svg class="heart" id="h1" style="left:300px;top:420px" viewBox="0 0 32 29"><path fill="__H1__" d="M16 29 2.6 15.6A8.3 8.3 0 0 1 14.4 3.9L16 5.5l1.6-1.6a8.3 8.3 0 0 1 11.8 11.7z"/></svg>
 <svg class="heart" id="h2" style="left:630px;top:420px" viewBox="0 0 32 29"><path fill="__H2__" d="M16 29 2.6 15.6A8.3 8.3 0 0 1 14.4 3.9L16 5.5l1.6-1.6a8.3 8.3 0 0 1 11.8 11.7z"/></svg>
 <div class="abs it" style="top:650px;font-size:80px;color:var(--c)">See all __N__ of</div>
 <div class="abs big" style="top:760px;font-size:150px;color:var(--c)">__TILE__&rsquo;S</div>
 <div class="abs big" style="top:940px;font-size:150px;color:var(--c)">MATCHES</div>
 <div id="lib" class="abs big" style="top:1250px;font-size:130px;color:var(--c)">LINK IN BIO</div>
 <img class="abs" src="__WORDMARK__" style="left:240px;top:1560px;width:600px">
</div>
<script>
const C=__CARDS__;const cl=(x,a=0,b=1)=>Math.min(b,Math.max(a,x));const ease=x=>1-Math.pow(1-cl(x),3);const back=x=>{x=cl(x);const c=1.7;return 1+(c+1)*Math.pow(x-1,3)+c*Math.pow(x-1,2)};
const fan=document.getElementById('fan');const chips=C.map((c,i)=>{const d=document.createElement('div');d.className='chip';d.innerHTML=`<div class="sw" style="background:${c.hex}"></div><b>${c.chip}</b><i>no. ${i+1}</i>`;fan.appendChild(d);return d});
const INTRO=3.2,PER=3.8,ENDT=INTRO+PER*C.length;window.DUR=ENDT+3.6;
function o(id,v){document.getElementById(id).style.opacity=v}
window.render=function(t){
 o('intro',t<INTRO?1:1-cl((t-INTRO)/.25));o('main',t<INTRO?0:(t<ENDT?cl((t-INTRO)/.25):1-cl((t-ENDT)/.25)));o('end',t<ENDT?0:cl((t-ENDT)/.3));
 document.getElementById('pile').style.transform=`scale(${back(t/.5)})`;
 const n=C.length;chips.forEach((d,i)=>{const u=ease((t-.9-i*.22)/.5);const ang=(i-(n-1)/2)*16;d.style.left=(415+(i-(n-1)/2)*190)+'px';d.style.top=(990+(1-u)*900)+'px';d.style.transform=`rotate(${ang*u}deg)`;d.style.transformOrigin='50% 120%';d.style.zIndex=5;d.style.opacity=u});
 if(t>=INTRO&&t<ENDT+.3){const k=Math.min(n-1,Math.floor((t-INTRO)/PER)),u=(t-INTRO)-k*PER;const c=C[k];
  document.getElementById('bsw').style.background=c.hex;document.getElementById('bnum').textContent='Color no. '+(k+1);document.getElementById('bname').textContent=c.chip;
  const bc=document.getElementById('bigchip');bc.style.transform=`translateY(${(1-ease(u/.4))*-500}px)`;
  const cd=document.getElementById('card');const ci=document.getElementById('cimg');if(ci.getAttribute('src')!==c.img)ci.setAttribute('src',c.img);
  const inn=1-ease((u-.35)/.45),out=cl((u-(PER-.35))/.35);cd.style.transform=`translateY(${inn*1500}px) scale(${1+0.012*Math.sin(u*2)})`;cd.style.opacity=1-out;bc.style.opacity=1-out;
  const lb=document.getElementById('lbl');lb.innerHTML=c.mat+'<small>by '+c.brand+'</small>';lb.style.opacity=cl((u-.8)/.25)*(1-out);
 }
 const w=t-ENDT;document.getElementById('h1').style.transform=`scale(${back(w/.45)*(1+.08*Math.sin(w*7))})`;document.getElementById('h2').style.transform=`scale(${back((w-.15)/.45)*(1+.08*Math.sin(w*7+1))})`;
 document.getElementById('lib').style.transform=`scale(${back((w-.8)/.45)*(1+.03*Math.sin(w*5))})`;
};
document.fonts.ready.then(()=>{document.querySelectorAll('.big').forEach(e=>{e.style.whiteSpace='nowrap';let f=parseFloat(getComputedStyle(e).fontSize);const sp=document.createElement('span');sp.textContent=e.textContent;sp.style.cssText='font:'+getComputedStyle(e).font+';white-space:nowrap;position:absolute;visibility:hidden';document.body.appendChild(sp);while(sp.offsetWidth>1000&&f>40){f-=4;sp.style.fontSize=f+'px'}e.style.fontSize=f+'px';sp.remove()})});render(0);
</script></body></html>
