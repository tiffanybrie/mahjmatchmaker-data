<!doctype html><html><head><meta charset="utf-8"><style>
@font-face{font-family:Alfa;src:url(file:///tmp/cc/f/fontsource-alfa-slab-one-5.3.0/package/files/alfa-slab-one-latin-400-normal.woff2)}
@font-face{font-family:Bitter;font-weight:700;src:url(file:///tmp/cc/f/fontsource-bitter-5.3.0/package/files/bitter-latin-700-normal.woff2)}
@font-face{font-family:Bitter;font-weight:400;src:url(file:///tmp/cc/f/fontsource-bitter-5.3.0/package/files/bitter-latin-400-normal.woff2)}
@font-face{font-family:Play;font-style:italic;src:url(file:///tmp/cc/f/fontsource-playfair-display-5.3.0/package/files/playfair-display-latin-700-italic.woff2)}
*{box-sizing:border-box;margin:0}
body{width:1080px;height:1920px;overflow:hidden;background:#fbf1e3;font-family:Bitter;color:#2a2036;position:relative}
.abs{position:absolute}
#snow{position:absolute;inset:0;pointer-events:none}
.flake{position:absolute;border-radius:50%;background:#fff;box-shadow:0 0 6px rgba(163,25,46,.25)}
.big{font-family:Alfa;text-align:center;width:1080px;left:0;text-shadow:5px 5px 0 #fff}
.it{font-family:Play;font-style:italic;text-align:center;width:1080px;left:0}
.pill{left:140px;width:800px;height:118px;border-radius:60px;display:flex;align-items:center;justify-content:center;font:700 52px Bitter;color:#fff;box-shadow:0 8px 18px rgba(0,0,0,.18)}
#grid{left:30px;width:1020px;display:grid;grid-template-columns:repeat(4,1fr);gap:16px}
#grid img{width:100%;aspect-ratio:4/5;border-radius:14px;box-shadow:0 6px 14px rgba(0,0,0,.22);display:block}
#band{left:0;width:1080px;height:200px;background:#a3192e;color:#fff;display:flex;flex-direction:column;align-items:center;justify-content:center;font-family:Alfa;font-size:84px;letter-spacing:.02em;box-shadow:0 10px 30px rgba(0,0,0,.25)}
#band small{font:700 38px Bitter;letter-spacing:.12em;margin-top:6px;color:#e9c77b}
.heart{position:absolute;width:120px;height:120px}
</style></head><body>
<div id="snow"></div>
<!-- scene 1 -->
<div id="s1" class="abs" style="inset:0">
 <img id="flame" class="abs" src="__FLAME__" style="left:390px;top:420px;width:300px">
 <div id="t1a" class="abs big" style="top:780px;font-size:170px;color:#a3192e">HOLIDAY</div>
 <div id="t1b" class="abs big" style="top:960px;font-size:170px;color:#1f5a3c">MATCHES</div>
 <div id="t1c" class="abs it" style="top:1170px;font-size:92px;color:#c99a3b">are here!</div>
</div>
<!-- scene 2 -->
<div id="s2" class="abs" style="inset:0">
 <div id="cnt" class="abs big" style="top:330px;font-size:330px;color:#a3192e">0</div>
 <div id="cl" class="abs it" style="top:700px;font-size:84px;color:#1f5a3c">holiday matches</div>
 <div id="p1" class="abs pill" style="top:930px;background:#1f5a3c">__NMATS__ mats</div>
 <div id="p2" class="abs pill" style="top:1090px;background:#a3192e">__NTILES__ tile sets</div>
 <div id="p3" class="abs pill" style="top:1250px;background:#c99a3b">__NBRANDS__ brands</div>
 <div id="p4" class="abs it" style="top:1460px;font-size:66px;color:#2a2036">all matched up for you</div>
</div>
<!-- scene 3 -->
<div id="s3" class="abs" style="inset:0;overflow:hidden">
 <div id="grid" class="abs" style="top:260px"></div>
 <div id="band" class="abs" style="top:40px">ALL MATCHED UP<small>MATS · TILES · RACKS</small></div>
</div>
<!-- scene 4: end card -->
<div id="s4" class="abs" style="inset:0">
 <svg class="heart" id="h1" style="left:250px;top:330px" viewBox="0 0 32 29"><path fill="#a3192e" d="M16 29 2.6 15.6A8.3 8.3 0 0 1 14.4 3.9L16 5.5l1.6-1.6a8.3 8.3 0 0 1 11.8 11.7z"/></svg>
 <svg class="heart" id="h2" style="left:710px;top:330px" viewBox="0 0 32 29"><path fill="#1f5a3c" d="M16 29 2.6 15.6A8.3 8.3 0 0 1 14.4 3.9L16 5.5l1.6-1.6a8.3 8.3 0 0 1 11.8 11.7z"/></svg>
 <div class="abs it" style="top:520px;font-size:86px;color:#1f5a3c">Find your</div>
 <div class="abs big" style="top:640px;font-size:150px;color:#a3192e">HOLIDAY<br>MATCH</div>
 <div class="abs" style="top:1060px;left:0;width:1080px;text-align:center;font:700 54px Bitter;color:#2a2036">Holiday mats, tile sets<br>&amp; racks, matched by Tiffany</div>
 <div id="lib" class="abs big" style="top:1330px;font-size:128px;color:#a3192e">LINK IN BIO</div>
 <img class="abs" src="__WORDMARK__" style="left:240px;top:1600px;width:600px">
</div>
<script>
const CARDS=__CARDS__, N=__N__;
const g=document.getElementById('grid');CARDS.forEach(s=>{const i=document.createElement('img');i.src=s;g.appendChild(i)});
const imgs=[...g.children];
// deterministic snow
const sn=document.getElementById('snow');const F=[];for(let i=0;i<70;i++){const d=document.createElement('div');d.className='flake';const r=4+((i*37)%9);d.style.width=d.style.height=r+'px';sn.appendChild(d);F.push({d,x:(i*151)%1080,y:(i*263)%1920,v:40+((i*17)%60),w:(i%7)*0.6})}
const cl=(x,a=0,b=1)=>Math.min(b,Math.max(a,x));const ease=x=>1-Math.pow(1-cl(x),3);const back=x=>{x=cl(x);const c=1.7;return 1+(c+1)*Math.pow(x-1,3)+c*Math.pow(x-1,2)};
function show(id,o,sc=1,dy=0){const e=document.getElementById(id);e.style.opacity=o;e.style.transform=`translateY(${dy}px) scale(${sc})`;e.style.transformOrigin='50% 50%'}
const T1=2.8,T2=7.6,T3=13.4,DUR=17.0;
window.render=function(t){
 F.forEach(f=>{f.d.style.left=(f.x+Math.sin(t*1.3+f.w)*18)+'px';f.d.style.top=((f.y+f.v*t)%1960-20)+'px'});
 // scene visibility with crossfades
 const a1=t<T1?1:1-cl((t-T1)/.3), a2=t<T1?0:(t<T2?cl((t-T1)/.3):1-cl((t-T2)/.3)), a3=t<T2?0:(t<T3?cl((t-T2)/.3):1-cl((t-T3)/.3)), a4=t<T3?0:cl((t-T3)/.35);
 document.getElementById('s1').style.opacity=a1;document.getElementById('s2').style.opacity=a2;document.getElementById('s3').style.opacity=a3;document.getElementById('s4').style.opacity=a4;
 // s1
 show('flame',cl(t/.3),back(t/.6)*(1+0.04*Math.sin(t*6)));
 show('t1a',cl((t-.35)/.25),back((t-.35)/.5));show('t1b',cl((t-.65)/.25),back((t-.65)/.5));show('t1c',cl((t-1.1)/.3),1,40*(1-ease((t-1.1)/.5)));
 // s2 counter
 const u=t-T1;const c=Math.round(N*ease(u/2.2));document.getElementById('cnt').textContent=c;
 show('cnt',1,1+0.06*Math.max(0,1-Math.abs(u-2.3)*4));show('cl',cl((u-.2)/.3));
 show('p1',cl((u-2.4)/.25),back((u-2.4)/.45));show('p2',cl((u-2.8)/.25),back((u-2.8)/.45));show('p3',cl((u-3.2)/.25),back((u-3.2)/.45));show('p4',cl((u-3.7)/.3),1,30*(1-ease((u-3.7)/.5)));
 // s3 mosaic: cards pop in fast, then grid scrolls
 const v=t-T2;imgs.forEach((im,i)=>{const s=v-i*0.07;im.style.opacity=cl(s/.12);im.style.transform=`scale(${0.6+0.4*back(s/.3)}) rotate(${(i%2?1:-1)*(1-ease(s/.3))*8}deg)`});
 const rows=Math.ceil(imgs.length/4);const rowH=(1020-48)/4*1.25+16;const maxScroll=Math.max(0,rows*rowH-1600);
 g.style.transform=`translateY(${-maxScroll*ease((v-1.8)/3.6)}px)`;
 show('band',1,1,-220*(1-ease(v/.5)));
 // s4
 const w=t-T3;show('h1',cl(w/.2),back(w/.45)*(1+0.08*Math.sin(w*7)));show('h2',cl((w-.15)/.2),back((w-.15)/.45)*(1+0.08*Math.sin(w*7+1)));
 show('lib',cl((w-.9)/.25),back((w-.9)/.45)*(1+0.03*Math.sin(w*5)));
};
window.DUR=DUR;render(0);
</script></body></html>
