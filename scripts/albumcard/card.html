<!doctype html><html><head><meta charset="utf-8"><style>
@font-face{font-family:Alfa;src:url(file:///tmp/cc/f/fontsource-alfa-slab-one-5.3.0/package/files/alfa-slab-one-latin-400-normal.woff2)}
@font-face{font-family:Bitter;font-weight:700;src:url(file:///tmp/cc/f/fontsource-bitter-5.3.0/package/files/bitter-latin-700-normal.woff2)}
*{margin:0;box-sizing:border-box}html,body{width:1080px;height:1350px;overflow:hidden;background:#f2e0cf;position:relative}
#mat{position:absolute;top:120px;left:0;width:1080px;height:1000px;background-size:cover;background-position:center}
#tb{position:absolute;top:-23px;left:-69px;width:1208px;height:162px;background:#f2e0cf;border-radius:0 0 40px 40px}
#t{position:absolute;top:2px;left:0;width:1080px;height:127px;display:flex;align-items:center;justify-content:center;font:106px/1 Alfa;letter-spacing:-.041em;text-transform:uppercase;white-space:nowrap;
 text-shadow:4px 4px 0 #fff,-4px -4px 0 #fff,4px -4px 0 #fff,-4px 4px 0 #fff,0 5px 0 #fff,0 -5px 0 #fff,5px 0 0 #fff,-5px 0 0 #fff}
#t .plus{font-size:.5em;margin:0 .14em}
#bb{position:absolute;right:0;top:110px;width:256px;display:flex;flex-direction:column;align-items:stretch;gap:0}
#bb .lg{height:62px;background:rgba(255,255,255,.92);display:flex;align-items:center;justify-content:center;padding:8px 12px}
#bb .lg img{max-height:100%;max-width:100%}
#bb .bar{height:52px;margin-left:24px;display:flex;align-items:center;padding-left:14px;font:700 24px Bitter;color:#fff;text-shadow:0 1px 2px rgba(0,0,0,.45);
 background-image:linear-gradient(180deg,rgba(255,255,255,.28),rgba(255,255,255,0) 40%,rgba(0,0,0,.18));box-shadow:0 3px 6px rgba(0,0,0,.25)}
#racks{position:absolute;left:0;top:0;width:1080px;height:1350px;pointer-events:none}
#racks img{position:absolute;filter:drop-shadow(0 12px 14px rgba(0,0,0,.38));transform-origin:50% 50%}
#rlogo{position:absolute;width:170px;height:170px;border-radius:50%;background:#fff;display:flex;align-items:center;justify-content:center;padding:22px;box-shadow:0 6px 14px rgba(0,0,0,.25)}
#rlogo img{max-width:100%;max-height:100%}
#tile{position:absolute;left:657px;top:595px;width:439px;height:549px;border:13px solid #f2e0cf;border-right:0;border-top-left-radius:40px;overflow:hidden;background:#fff}
#tile img{width:100%;height:100%;object-fit:cover}
#rib{position:absolute;left:300px;top:1102px;width:370px;height:140px;background:#fff;clip-path:polygon(0 0,100% 0,100% 100%,0 100%,13% 50%)}
#omm{position:absolute;left:404px;top:1114px;width:232px;height:116px}
#navy{position:absolute;left:657px;top:1102px;width:423px;height:140px}
#mlogo{position:absolute;left:150px;top:1078px;width:188px;height:188px;border-radius:50%;background:#fff;display:flex;align-items:center;justify-content:center;padding:24px;box-shadow:0 4px 12px rgba(0,0,0,.2)}
#mlogo img{max-width:100%;max-height:100%}
#fb{position:absolute;left:-33px;top:1242px;width:1156px;height:144px;background:#f2e0cf;border-radius:40px 40px 0 0}
#f{position:absolute;top:1245px;left:0;width:1080px;height:105px;display:flex;align-items:center;justify-content:center;font:86px/1 Alfa;color:#2a4aa1;letter-spacing:-.041em;white-space:nowrap;
 text-shadow:3px 3px 0 #fff,-3px -3px 0 #fff,3px -3px 0 #fff,-3px 3px 0 #fff}
</style></head><body>
<div id="mat"></div><div id="racks"></div><div id="tile"><img></div><div id="bb"></div>
<div id="tb"></div><div id="t"></div>
<div id="rib"></div><img id="omm"><img id="navy">
<div id="fb"></div><div id="f"></div>
<script>
const D=__DATA__;
const t=document.getElementById('t');const [a,b]=D.title.split('+');t.innerHTML='<span id="ts">'+a.trim()+'<span class="plus">+</span>'+b.trim()+'</span>';t.style.color=D.col;
const f=document.getElementById('f');f.innerHTML='<span id="fs">'+D.code+'</span>';
window.fit=()=>{const ts=document.getElementById('ts');let fs=106;t.style.fontSize=fs+'px';while(ts.offsetWidth>1040&&fs>40){fs-=2;t.style.fontSize=fs+'px'}
 const fsn=document.getElementById('fs');let ff=86;f.style.fontSize=ff+'px';while(fsn.offsetWidth>1050&&ff>30){ff-=2;f.style.fontSize=ff+'px'}};
document.getElementById('mat').style.backgroundImage=`url(${D.mat})`;
document.querySelector('#tile img').src=D.tile;
document.getElementById('omm').src=D.omm;document.getElementById('navy').src=D.navy;
// B&B chart top-right
const bb=document.getElementById('bb');if(D.bb.length){const lg=document.createElement('div');lg.className='lg';lg.innerHTML=`<img src="${D.bblogo}">`;bb.appendChild(lg);
 D.bb.forEach(x=>{const r=document.createElement('div');r.className='bar';r.style.backgroundColor=x.hex;r.textContent=x.name;if(x.light)r.style.color='#2b2b2b',r.style.textShadow='none';bb.appendChild(r)})}
// photo racks lower-left, low on the mat
const rk=document.getElementById('racks');const asp=D.rasp&&D.rasp[0]||6;
let pos,w;if(asp>3){pos=[[-150,905,-24],[-190,995,-20],[-130,1075,-14],[-170,1150,-10]];w=720}else{pos=[[-40,880,0]];w=600}
const rr=D.racks.length?Array.from({length:pos.length},(_,i)=>D.racks[i%D.racks.length]):[];rr.forEach((r,i)=>{const im=document.createElement('img');im.src=r;const p=pos[i];im.style.left=p[0]+'px';im.style.top=p[1]+'px';im.style.width=w+'px';im.style.transform=`rotate(${p[2]}deg)`;rk.appendChild(im)});
if(D.rlogo){const d=document.createElement('div');d.id='rlogo';d.style.left='40px';d.style.top='1040px';d.innerHTML=`<img src="${D.rlogo}">`;rk.appendChild(d)}
</script></body></html>
