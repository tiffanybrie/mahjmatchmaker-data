<!doctype html><html><head><meta charset="utf-8"><style>
/* Album match card (1080x1350), matching the live album cards (e.g. Talulah + Anastasia):
   cream title band, mat edge to edge down to the code footer, Bird & Bamboo chart top right,
   2-3 separate racks (one copy each) angled across the lower left with white name pills,
   tile box bottom right with the navy logo box under it, code footer. No brand logo strip. */
@font-face{font-family:Alfa;src:url(file:///tmp/cc/f/fontsource-alfa-slab-one-5.3.0/package/files/alfa-slab-one-latin-400-normal.woff2)}
@font-face{font-family:Bitter;font-weight:700;src:url(file:///tmp/cc/f/fontsource-bitter-5.3.0/package/files/bitter-latin-700-normal.woff2)}
*{margin:0;box-sizing:border-box}html,body{width:1080px;height:1350px;overflow:hidden;background:#f2e0cf;position:relative}
#mat{position:absolute;top:132px;left:0;width:1080px;height:1110px;background-size:cover;background-position:center}
#t{position:absolute;top:0;left:0;width:1080px;height:132px;display:flex;align-items:center;justify-content:center;font:96px/1 Alfa;letter-spacing:-.02em;text-transform:uppercase;white-space:nowrap;
 text-shadow:4px 4px 0 #fff,-4px -4px 0 #fff,4px -4px 0 #fff,-4px 4px 0 #fff,0 5px 0 #fff,0 -5px 0 #fff,5px 0 0 #fff,-5px 0 0 #fff}
#t .plus{margin:0 .25em}
#bb{position:absolute;right:8px;top:158px;width:310px;display:flex;flex-direction:column;align-items:flex-end;gap:12px}
#bb .lg{width:246px;height:58px;background:#fbf3ea;border-radius:12px;display:flex;align-items:center;justify-content:center;padding:8px 14px;box-shadow:0 3px 8px rgba(0,0,0,.18)}
#bb .lg img{max-height:100%;max-width:100%}
#bb .bar{width:300px;height:44px;display:flex;align-items:center;padding-left:14px;font:700 26px Bitter;color:#fff;text-shadow:0 1px 2px rgba(0,0,0,.45);border-radius:3px 0 0 3px;
 background-image:linear-gradient(180deg,rgba(255,255,255,.35),rgba(255,255,255,0) 45%,rgba(0,0,0,.18));box-shadow:0 3px 6px rgba(0,0,0,.25)}
.rk{position:absolute;transform-origin:0 50%}
.rk img{display:block;width:100%;filter:drop-shadow(0 14px 12px rgba(0,0,0,.4))}
.rk b{position:absolute;left:150px;bottom:100%;margin-bottom:-6px;background:#fff;color:#1f2a44;border-radius:999px;padding:7px 18px;font:700 25px Bitter;white-space:nowrap;box-shadow:0 3px 8px rgba(0,0,0,.25)}
#tile{position:absolute;left:658px;top:583px;width:422px;height:526px;border:9px solid #fff;border-right:0;border-bottom:0;border-top-left-radius:34px;overflow:hidden;background:#fff}
#tile img{width:100%;height:100%;object-fit:cover}
#navy{position:absolute;left:658px;top:1106px;width:422px;height:136px;object-fit:cover}
#f{position:absolute;top:1242px;left:0;width:1080px;height:108px;display:flex;align-items:center;justify-content:center;font:82px/1 Alfa;color:#2a4aa1;letter-spacing:-.03em;white-space:nowrap;
 text-shadow:3px 3px 0 #fff,-3px -3px 0 #fff,3px -3px 0 #fff,-3px 3px 0 #fff}
</style></head><body>
<div id="mat"></div><div id="racks"></div><div id="bb"></div>
<div id="tile"><img></div><img id="navy">
<div id="t"></div><div id="f"></div>
<script>
const D=__DATA__;
const t=document.getElementById('t');const [a,b]=D.title.split('+');t.innerHTML='<span id="ts">'+a.trim()+'<span class="plus">+</span>'+b.trim()+'</span>';t.style.color=D.col;
const f=document.getElementById('f');f.innerHTML='<span id="fs">'+D.code+'</span>';
window.fit=()=>{const ts=document.getElementById('ts');let fs=parseFloat(getComputedStyle(t).fontSize);while(ts.offsetWidth>1040&&fs>40){fs-=2;t.style.fontSize=fs+'px'}
 const fsn=document.getElementById('fs');let ff=82;f.style.fontSize=ff+'px';while(fsn.offsetWidth>1050&&ff>30){ff-=2;f.style.fontSize=ff+'px'}};
document.getElementById('mat').style.backgroundImage=`url(${D.mat})`;
document.querySelector('#tile img').src=D.tile;document.getElementById('navy').src=D.navy;
const bb=document.getElementById('bb');if(D.bb.length){const lg=document.createElement('div');lg.className='lg';lg.innerHTML=`<img src="${D.bblogo}">`;bb.appendChild(lg);
 D.bb.forEach(x=>{const r=document.createElement('div');r.className='bar';r.style.backgroundColor=x.hex;r.textContent=x.name;if(x.light)r.style.color='#2b2b2b',r.style.textShadow='none';bb.appendChild(r)})}
// racks: one copy each, separate, angled across the lower left (slots from the live album cards)
const SL=[[-70,975,-24,700],[-50,1090,-21,700],[-30,1195,-18,680]];
const rk=document.getElementById('racks');
D.racks.slice(0,3).forEach((r,i)=>{const s=SL[i+(3-Math.min(3,D.racks.length))];const d=document.createElement('div');d.className='rk';
 d.style.left=s[0]+'px';d.style.top=s[1]+'px';d.style.width=s[3]+'px';d.style.transform=`rotate(${s[2]}deg)`;
 d.innerHTML=`<img src="${r.img}"><b>${r.label}</b>`;rk.appendChild(d)});
if(D.hol){const tb=document.createElement('div');tb.style.cssText=`position:absolute;top:0;left:0;width:1080px;height:132px;background:${D.col}`;document.body.insertBefore(tb,t);
 t.style.color='#fff';t.style.top='34px';t.style.height='98px';t.style.fontSize='80px';t.style.textShadow='4px 4px 0 rgba(0,0,0,.28)';
 const hl=document.createElement('div');hl.style.cssText='position:absolute;top:2px;left:0;width:1080px;height:46px;display:flex;align-items:center;justify-content:center;gap:16px;font:700 32px Bitter;letter-spacing:.24em;color:#fbe7b0;text-shadow:0 2px 3px rgba(0,0,0,.3)';
 hl.innerHTML=`<img src="${D.flame}" style="height:44px">HOLIDAY MATCH<img src="${D.flame}" style="height:44px">`;document.body.appendChild(hl);
 document.body.style.background='#f2e0cf';f.style.background='#3e6b52';f.style.color='#fbf1e3';f.style.textShadow='3px 3px 0 rgba(0,0,0,.3)'}
</script></body></html>
