body{background:#fff7f4;font-family:Bitter,Georgia,serif;color:#2b2140;position:relative}

.card{position:absolute;inset:0;border-radius:40px;overflow:hidden;background:#eee;box-shadow:0 18px 50px rgba(40,10,40,.25);transform-origin:50% 120%}
.card .ph{position:absolute;inset:0;background-size:cover;background-position:center}
.card .grad{position:absolute;left:0;right:0;bottom:0;height:300px;background:linear-gradient(transparent,rgba(20,10,30,.82))}

.card .cap .nm{font:62px/1.05 Shrikhand;text-shadow:0 3px 12px rgba(0,0,0,.35)}

.stamp{position:absolute;top:70px;padding:10px 28px;border:9px solid;border-radius:22px;font:88px/1 Shrikhand;opacity:0;letter-spacing:.02em;background:rgba(255,255,255,.9);box-shadow:0 6px 18px rgba(0,0,0,.25)}
.stamp.yes{left:44px;color:#2ea56b;border-color:#2ea56b;transform:rotate(-14deg)}
.stamp.no{right:44px;color:#e0465a;border-color:#e0465a;transform:rotate(14deg)}
#btns{position:absolute;top:1385px;left:0;right:0;display:flex;justify-content:center;gap:120px}
.b{width:150px;height:150px;border-radius:50%;background:#fff;display:flex;align-items:center;justify-content:center;box-shadow:0 10px 30px rgba(80,30,60,.22)}
.b svg{width:72px;height:72px}
#line{position:absolute;top:1560px;left:40px;right:40px;text-align:center;font:44px/1.15 Shrikhand;color:#8a492b}
#burst{position:absolute;inset:0;pointer-events:none}
#end{position:absolute;inset:0;background:linear-gradient(170deg,#fff7f4,#fde3ec);opacity:0;display:flex;flex-direction:column;align-items:center;padding-top:210px}
#end .its{font:150px/1 Shrikhand;color:#d6608c;text-align:center;text-shadow:0 6px 0 #fff}
#end .sub{font:700 40px Bitter;color:#8a492b;margin-top:26px;text-align:center}
#pair{position:relative;width:900px;height:470px;margin-top:70px}
#pair .c{position:absolute;top:30px;width:400px;height:400px;border-radius:50%;border:14px solid #fff;box-shadow:0 18px 50px rgba(80,30,60,.25);background-size:cover;background-position:center}
#pair .c1{left:40px;background-image:url(file:///home/claude/mahjmatchmaker-data/assets/tiles/album/smith.jpg)}
#pair .c2{right:40px;background-image:url(file:///tmp/claude-0/-home-claude-mahjmatchmaker-data/801d31e6-4a74-59be-8637-eb67bfa0e99e/scratchpad/swr/cut-hawthorne.jpg)}
#pair svg.h{position:absolute;left:50%;top:50%;width:230px;height:210px;transform:translate(-50%,-46%)}
#end .who{display:flex;justify-content:space-between;width:820px;font:700 34px Bitter;color:#2b2140;margin-top:8px}
#end .more{margin-top:70px;font:46px/1.2 Shrikhand;color:#8a492b;text-align:center}
#end .lib{margin-top:26px;background:#8a492b;color:#fff;font:700 44px Bitter;letter-spacing:.08em;padding:22px 54px;border-radius:99px}
#end .wm{position:absolute;bottom:120px;height:74px}
</style></head><body>
<div class="bgdots"></div>
<div id="top"><img class="fl" src="file:///home/claude/mahjmatchmaker-data/assets/brand/flame-heart.png"><img class="wm" src="file:///home/claude/mahjmatchmaker-data/assets/brand/mahjmatchmaker-wordmark.png"></div>
<div id="app">
 <div id="appbar"><img src="file:///home/claude/mahjmatchmaker-data/assets/brand/flame-heart.png" style="height:44px">Find your match</div>
 <div id="prof"><div id="tiles"></div><div id="pbio"><div class="k">Now matching</div><div class="n"><img class="fh" src="file:///home/claude/mahjmatchmaker-data/assets/brand/flame-heart.png">Smith</div><div class="s">Single &amp; ready to mingle.</div><div class="tags"><span>woodgrain backs</span><span>navy</span><span>Oh My Mahjong</span></div></div></div>
 <div id="stack"></div>
 <div id="btns"><div class="b" id="bno"><svg viewBox="0 0 24 24"><path d="M5 5L19 19M19 5L5 19" stroke="#e0465a" stroke-width="3.6" stroke-linecap="round"/></svg></div><div class="b" id="byes"><svg viewBox="0 0 24 24"><path d="M12 21s-7.5-4.6-9.6-9.2C.9 8.4 3 4.5 6.7 4.5c2.2 0 3.6 1.3 4.3 2.6.7-1.3 2.1-2.6 4.3-2.6 3.7 0 5.8 3.9 4.3 7.3C19.5 16.4 12 21 12 21z" fill="#2ea56b"/></svg></div></div>
 <div id="line"></div>
</div>
<svg id="burst" viewBox="0 0 1080 1920"></svg>
<div id="end"><div class="its">It's a<br>Match!</div><div class="sub">Smith + Hawthorne, the official pair</div>
 <div id="pair"><div class="c c1"></div><div class="c c2"></div>
 <svg class="h" viewBox="0 0 230 210"><path d="M115 200S12 140 12 72C12 36 38 12 70 12c22 0 37 12 45 28 8-16 23-28 45-28 32 0 58 24 58 60 0 68-103 128-103 128z" fill="#4a1f3d" stroke="#fff" stroke-width="10"/><path d="M135 178S70 135 70 88c0-24 17-40 38-40 15 0 24 8 29 19 5-11 14-19 29-19 21 0 38 16 38 40 0 47-69 90-69 90z" fill="#8a492b" stroke="#fff" stroke-width="8" transform="translate(-6,6) scale(.9) translate(14,10)"/></svg></div>
 <div class="who"><span>Smith tiles</span><span>Hawthorne mat</span></div>
 <div class="more">Smith has 26 matches.<br>Come meet them all.</div>
 <div class="lib">LINK IN BIO</div>
 <img class="wm" src="file:///home/claude/mahjmatchmaker-data/assets/brand/mahjmatchmaker-wordmark.png">
</div>
<script>
const C=[{"n": "Lover Era", "b": "Peace Love Mahjong", "bio": "Bubblegum pink, all sugar.", "img": "file:///tmp/claude-0/-home-claude-mahjmatchmaker-data/801d31e6-4a74-59be-8637-eb67bfa0e99e/scratchpad/swr/cut-loverera.jpg", "yes": false, "l1": "First up... bubblegum pink?", "l2": "Too sweet for Smith. Next!"}, {"n": "Hawthorne", "b": "Oh My Mahjong", "bio": "Navy + plum florals. Smith's official pair.", "img": "file:///tmp/claude-0/-home-claude-mahjmatchmaker-data/801d31e6-4a74-59be-8637-eb67bfa0e99e/scratchpad/swr/cut-hawthorne.jpg", "yes": true, "l1": "Navy and plum? Smith is blushing.", "l2": "It's a match!"}, {"n": "Navy Vegan Leather", "b": "Bam Bird Boutique", "bio": "Tailored, simple, lets the woodgrain shine.", "img": "file:///tmp/claude-0/-home-claude-mahjmatchmaker-data/801d31e6-4a74-59be-8637-eb67bfa0e99e/scratchpad/swr/cut-navy26.jpg", "yes": true, "l1": "Tall, dark and tailored.", "l2": "Swiped right!"}, {"n": "Duck Camp", "b": "Mahjong Moxie", "bio": "Woodgrain meets the duck blind.", "img": "file:///tmp/claude-0/-home-claude-mahjmatchmaker-data/801d31e6-4a74-59be-8637-eb67bfa0e99e/scratchpad/swr/duck_sq.jpg", "yes": true, "l1": "A duck-blind date? Yes please.", "l2": "Three for three!"}];const st=document.getElementById('stack');
C.forEach((c,i)=>{const d=document.createElement('div');d.className='card';d.style.zIndex=100-i;
 d.innerHTML=(c.img?`<div class="ph" style="background-image:url(${c.img})"></div>`:`<div class="ph" style="background:repeating-linear-gradient(0deg,#fbfaf7 0 6px,#f1efe9 6px 7px),#fbfaf7"></div>`)+
 `<div class="grad"></div><div class="cap"><div class="nm">${c.n}</div><div class="br">${c.b}</div><div class="bio">${c.bio}</div></div><div class="stamp yes">MATCH</div><div class="stamp no">NOPE</div>`;st.appendChild(d)});
const cards=[...st.children];
const ease=x=>x<0?0:x>1?1:1-Math.pow(1-x,3), ein=x=>x<0?0:x>1?1:x*x*x;
const T=[[1.6, 2.9000000000000004, 3.45], [3.8000000000000003, 6.2, 6.75], [7.1000000000000005, 9.5, 10.05], [10.4, 12.8, 13.350000000000001]]; // per card: [show, decide, out]
let hearts=[];for(let k=0;k<26;k++)hearts.push({a:Math.random()*Math.PI*2,r:180+Math.random()*420,s:.5+Math.random()*1.1,c:['#d6608c','#f3a9c4','#8a492b','#2ea56b','#4a1f3d'][k%5],d:Math.random()*.15});
function heartPath(x,y,s){return `<path transform="translate(${x},${y}) scale(${s})" d="M0 18S-18 7-18-5c0-6 4-10 9-10 4 0 7 2 9 6 2-4 5-6 9-6 5 0 9 4 9 10C18 7 0 18 0 18z"/>`}
window.render=function(t){
 // intro
 const ip=ease(t/0.9);document.getElementById('app').style.transform=`translateY(${(1-ip)*80}px)`;document.getElementById('app').style.opacity=ip;
 document.getElementById('tiles').style.transform=`scale(${.85+.15*ease((t-.2)/.7)})`;
 let line='Smith is single &amp; ready to mingle.',bt={no:1,yes:1},burst='';
 cards.forEach((el,i)=>{const [s,dc,o]=T[i];const c=C[i];
  // depth
  let depth=0;for(let j=0;j<i;j++)if(t<T[j][2]+.45)depth++;
  const sc=1-depth*.045, ty=depth*-26;
  if(t<o){el.style.transform=`translateY(${ty}px) scale(${sc})`;el.style.opacity=depth>2?0:1;
   const stp=el.querySelector(c.yes?'.stamp.yes':'.stamp.no');const sp=ease((t-dc)/.25);stp.style.opacity=t>dc?sp:0;stp.style.transform=(c.yes?'rotate(-14deg)':'rotate(14deg)')+` scale(${1.6-.6*sp})`;
   if(t>=s&&t<o)line=t<dc?c.l1:c.l2;
   if(t>dc-.2&&t<dc+.15)bt[c.yes?'yes':'no']=1+.18*Math.sin(Math.min(1,(t-dc+.2)/.35)*Math.PI);
  }else{const p=ein((t-o)/.45),dir=c.yes?1:-1;el.style.transform=`translate(${dir*p*1300}px,${-p*120}px) rotate(${dir*p*28}deg)`;el.style.opacity=1-p*.2;
   if(t<o+1.2)line=c.l2;
   if(c.yes){const q=(t-o)/1.1;if(q>0&&q<1){hearts.forEach(h=>{const qq=ease((q-h.d)/(1-h.d));if(qq<=0)return;const x=540+Math.cos(h.a)*h.r*qq,y=980+Math.sin(h.a)*h.r*qq-qq*160;burst+=`<g fill="${h.c}" opacity="${1-qq}">${heartPath(x,y,h.s*2.2)}</g>`})}}}
 });
 document.getElementById('bno').style.transform=`scale(${bt.no})`;document.getElementById('byes').style.transform=`scale(${bt.yes})`;
 document.getElementById('line').innerHTML=line;document.getElementById('burst').innerHTML=burst;
 const e=ease((t-13.9)/.6);const end=document.getElementById('end');end.style.opacity=e;
 end.querySelector('.its').style.transform=`scale(${.6+.4*ease((t-13.9-.1)/.5)})`;
 end.querySelector('#pair .c1').style.transform=`translateX(${(1-ease((t-13.9-.25)/.6))*-260}px)`;
 end.querySelector('#pair .c2').style.transform=`translateX(${(1-ease((t-13.9-.25)/.6))*260}px)`;
 const hp=ease((t-13.9-.7)/.4);end.querySelector('svg.h').style.transform=`translate(-50%,-46%) scale(${hp*(1+.06*Math.sin((t-13.9)*6))})`;
};
render(0);
</script></body></html>
