document.addEventListener('keydown',e=>{if(e.key==='ArrowRight')mark('s');if(e.key==='ArrowLeft')step(-1);if(e.key==='Enter'||e.key===' ')mark('y');if(e.key==='ArrowDown')step(1);if(e.key==='ArrowUp')step(-1)});
$('list').onclick=()=>{const B=$('shB');B.textContent='';$('shT').textContent=D.listTitle;D.groups.forEach((G,k)=>{const b=document.createElement('button');b.className='it'+(k===g?' cur':'');const im=document.createElement('img');im.src=G.thumb||G.img;const yc=Object.values(V[G.id]||{}).filter(x=>x==='y').length;const dn=Object.keys(V[G.id]||{}).length;b.append(im,document.createTextNode(G.label));const s=document.createElement('small');s.textContent=dn?`${yc} yes · ${dn} seen`:'';b.append(s);b.onclick=()=>{g=k;i=0;zi=0;$('sheet').classList.remove('on');paint()};B.append(b)});$('sheet').classList.add('on')};
$('other').onclick=()=>{const B=$('shB');B.textContent='';$('shT').textContent='Try another tile set';const o=ordAll();D.items.filter(x=>!o.includes(x.id)).forEach(x=>{const b=document.createElement('button');b.className='it';const im=document.createElement('img');im.loading='lazy';im.src=x.img;b.append(im,document.createTextNode(x.label));const v=(V[vk()]||{})[x.id];if(v){const s=document.createElement('small');s.textContent=v==='y'?'yes':'no';b.append(s)}b.onclick=()=>{if(onlyY){onlyY=false;$('yonly').textContent='★ Review my yeses'}const a=ordAll().slice();const cur=a[i];let p=a.indexOf(cur);p=p<0?a.length:p;a.splice(p,0,x.id);D.order[grp().id]=a;i=p;$('sheet').classList.remove('on');paint()};B.append(b)});$('sheet').classList.add('on')};


let slMode='mat';
function slJump(gk,id){g=gk;const a=ordAll().slice();let p=a.indexOf(id);if(p<0){if(onlyY){onlyY=false;$('yonly').textContent='★ Review my yeses'}const cur=a[i];p=Math.max(0,a.indexOf(cur));a.splice(p,0,id);D.order[grp().id]=a}i=p;$('sheet').classList.remove('on');paint()}
function chip(img,txt,st,fn){const c=document.createElement('span');c.className='ch'+(st?' st':'');const ti=document.createElement('img');ti.src=img;c.append(ti,document.createTextNode(txt));c.onclick=fn;return c}
function renderSL(){const B=$('shB');B.textContent='';
 const tg=document.createElement('div');tg.className='slh';tg.style.display='flex';tg.style.gap='8px';
 [['mat',D.mode==='mat'?'By mat':'By tile set'],['tile',D.mode==='mat'?'By tile set':'By mat']].forEach(([m,l])=>{const b=document.createElement('button');b.className='zoom';b.style.cssText='position:static;padding:7px 12px;background:'+(slMode===m?'#d9467f':'rgba(255,255,255,.16)');b.textContent=l;b.onclick=()=>{slMode=m;renderSL()};tg.append(b)});B.append(tg);
 const isS=(gid,id)=>N[gid+'__'+id]&&N[gid+'__'+id].star;const itm=id=>D.items.find(x=>x.id===id);let tot=0,stc=0;
 if(slMode==='mat'){$('shT').textContent=D.mode==='mat'?'Shortlist by mat':'Shortlist by tile set';
  D.groups.forEach((G,k)=>{const v=V[G.id]||{};const yes=Object.keys(v).filter(id=>v[id]==='y'&&itm(id));const gn=Object.keys(N).filter(key=>key.startsWith(G.id+'__')&&N[key]&&N[key].note).map(key=>[key.slice(G.id.length+2),N[key].note]);if(!yes.length&&!gn.length)return;
   yes.sort((a,b)=>(isS(G.id,b)?1:0)-(isS(G.id,a)?1:0));tot+=yes.length;stc+=yes.filter(id=>isS(G.id,id)).length;
   const row=document.createElement('div');row.className='sl';const im=document.createElement('img');im.src=G.thumb||G.img;im.onclick=()=>{g=k;i=0;$('sheet').classList.remove('on');paint()};const bx=document.createElement('div');
   const nm=document.createElement('div');nm.className='nm';nm.textContent=G.label;const br=document.createElement('div');br.className='br';br.textContent=(G.sub||'')+' · '+yes.length+' yes';bx.append(nm,br);
   yes.forEach(id=>bx.append(chip(itm(id).img,(isS(G.id,id)?'★ ':'')+itm(id).label,isS(G.id,id),()=>slJump(k,id))));
   gn.forEach(([id,t])=>{const n=document.createElement('div');n.className='nt clamp2';n.onclick=()=>n.classList.toggle('open');n.textContent='✎ '+(itm(id)?itm(id).label+': ':'')+t;bx.append(n)});
   row.append(im,bx);B.append(row)});
 }else{$('shT').textContent=(D.mode==='mat'?'Shortlist by tile set':'Shortlist by mat')+' (fewest matches first)';
  const rows=D.items.map(it=>{const ms=[];D.groups.forEach((G,k)=>{const v=V[G.id]||{};if(v[it.id]==='y')ms.push([k,G])});return [it,ms]});
  rows.sort((a,b)=>a[1].length-b[1].length);
  const gapN=3;const gaps=rows.filter(r=>r[1].length<gapN).length;
  rows.forEach(([it,ms])=>{tot+=ms.length;ms.sort((a,b)=>(isS(b[1].id,it.id)?1:0)-(isS(a[1].id,it.id)?1:0));
   const row=document.createElement('div');row.className='sl';const im=document.createElement('img');im.src=it.img;const bx=document.createElement('div');
   const nm=document.createElement('div');nm.className='nm';nm.textContent=it.label;const br=document.createElement('div');br.className='br';
   const sc=ms.filter(([k,G])=>isS(G.id,it.id)).length;stc+=sc;br.textContent=ms.length+(D.mode==='mat'?' holiday mat':' tile set')+(ms.length===1?'':'s')+(sc?' · '+sc+' ★':'')+(ms.length<gapN?' · needs more':'');if(ms.length<gapN)br.style.color='#f3a9c4';bx.append(nm,br);
   ms.forEach(([k,G])=>bx.append(chip(G.thumb||G.img,(isS(G.id,it.id)?'★ ':'')+G.label,isS(G.id,it.id),()=>slJump(k,it.id))));
   if(ms.length<gapN){const sg=((D.sugg||{})[it.id]||[]).filter(gid=>{const v=V[gid]||{};return !v[it.id]}).slice(0,4);
    if(sg.length){const t=document.createElement('div');t.className='nt';t.textContent='Try these (tap to swipe):';bx.append(t);
     sg.forEach(gid=>{const k=D.groups.findIndex(G=>G.id===gid);if(k<0)return;const G=D.groups[k];const c=chip(G.thumb||G.img,G.label,false,()=>slJump(k,it.id));c.style.outline='1px dashed #f3d38a';bx.append(c)})}}
   row.append(im,bx);B.append(row)});
  const h=document.createElement('div');h.className='slh';h.textContent=gaps+(D.mode==='mat'?' tile sets have fewer than ':' mats have fewer than ')+gapN+' matches. Dashed chips are suggestions; tap one to swipe that pairing.';B.insertBefore(h,tg.nextSibling);
 }
 const h=document.createElement('div');h.className='slh';h.textContent=tot?`${tot} yeses · ${stc} best matches. Tap any chip to jump to it.`:'No yeses yet.';B.insertBefore(h,tg.nextSibling);$('sheet').classList.add('on')}
$('slist').onclick=renderSL;
$('yonly').onclick=()=>{onlyY=!onlyY;i=0;$('yonly').textContent=onlyY?'Show all':'★ Review my yeses';paint()};

const N={};
function nk(){return vk()+'__'+item().id}
function paintNote(){const x=N[nk()]||{};const b=$('nbadge');const t=(x.star?'★ Best match':'')+(x.star&&x.note?' · ':'')+(x.note||'');b.textContent=t;b.className='clamp2';b.onclick=e=>{e.stopPropagation();b.classList.toggle('open')};b.style.display=t?'':'none';$('bstar').textContent=x.star?'★ Best match':'☆ Best match'}
async function saveNote(){const k=vk(),id=item().id,x=N[k+'__'+id]||{};if(!db){$('foot').textContent='Sign in to claude.ai so your notes save.';return}
 for(let t=0;t<4;t++){try{await db.collection(COL+'_notes').doc((k+'__'+id).slice(0,190)).set({g:k,i:id,star:!!x.star,note:x.note||'',at:new Date().toISOString()});return}catch(e){await new Promise(r=>setTimeout(r,700))}}
 $('foot').textContent='Couldn’t save that note. Try again.'}
$('bstar').onclick=()=>{const key=nk();N[key]=N[key]||{};N[key].star=!N[key].star;paintNote();saveNote();if(N[key].star){const k=vk(),id=item().id;V[k]=V[k]||{};if(V[k][id]!=='y'){V[k][id]='y';save(k,id,'y');paint()}}};
$('bnote').onclick=()=>{const x=N[nk()]||{};$('ntext').value=x.note||'';const C=$('nchips');C.textContent='';['Love this one','Best match','Pair mat','Top pick','Close, but no','Better photo needed'].forEach(c=>{const b=document.createElement('button');b.className='zoom';b.style.position='static';b.style.background='rgba(0,0,0,.08)';b.style.color='inherit';b.textContent=c;b.onclick=()=>{const v=$('ntext').value.trim();$('ntext').value=v?(v+'. '+c):c};C.append(b)});$('nsheet').classList.add('on');setTimeout(()=>$('ntext').focus(),50)};
$('nX').onclick=()=>$('nsheet').classList.remove('on');
$('nsave').onclick=()=>{const key=nk();N[key]=N[key]||{};N[key].note=$('ntext').value.trim();$('nsheet').classList.remove('on');paintNote();saveNote()};

$('shX').onclick=()=>$('sheet').classList.remove('on');
function fit(){const st=$('stage');const W=st.clientWidth,H=st.clientHeight;let w=Math.min(W,H/1.05);const c=$('card');c.style.width=w+'px';c.style.height=Math.min(H,w*1.3)+'px'}window.addEventListener('resize',fit);fit();
if(D.mode==='tile'){$('other').textContent='+ Try another mat'}
paint();
(async()=>{try{db=await claude.use('db')}catch(e){}if(!db){$('foot').textContent='Sign in to claude.ai so your picks save.';return}const q=await db.collection(COL).limit(1000).get().catch(()=>null);const docs=q?q.docs:[];
 docs.forEach(d=>{const x=d.data();if(x&&x.v&&typeof x.v==='object'&&!x.g){V[d.id]=Object.assign({},x.v,V[d.id]||{})}});
 docs.forEach(d=>{const x=d.data();if(x&&x.g){V[x.g]=V[x.g]||{};V[x.g][x.i]=x.v}});
 try{const qn=await db.collection(COL+'_notes').limit(1000).get();qn.docs.forEach(d=>{const x=d.data();if(x&&x.g)N[x.g+'__'+x.i]={star:x.star,note:x.note}})}catch(e){}
 try{if($('sheet').classList.contains('on')&&$('shT').textContent.indexOf('Shortlist')===0)renderSL()}catch(e){}
 // resume: exact saved spot first, else first unseen
 let rs=false;try{const p=JSON.parse(localStorage.getItem(COL+'_pos')||'null');if(p){const k=D.groups.findIndex(G=>G.id===p.g);if(k>=0){g=k;const o=ordAll();const j=o.indexOf(p.i);i=j>=0?j:0;rs=true}}}catch(e){}
 if(!rs)for(let k=0;k<D.groups.length;k++){const o=D.order[D.groups[k].id]||D.items.map(x=>x.id);const seen=V[D.groups[k].id]||{};const j=o.findIndex(id=>!seen[id]);if(j>=0){g=k;i=j;break}}posReady=true;paint()})();
</script></body></html>

<script>
(function(){const SC=COL+'_status';let FD=null;
function fsum(){let y=0,n=0;Object.values(V).forEach(o=>Object.values(o||{}).forEach(v=>{if(v==='y')y++;else if(v==='n'||v==='s')n++}));
 const tot=(D.items||[]).length*((D.groups||[]).length||1);
 $('fsum').innerHTML='<b>'+y+'</b> yeses of <b>'+(y+n)+'</b> seen'+(tot?' (of '+tot+' mats)':'')+(FD&&FD.done?'<br><span style="color:#9fd9b4">Marked done '+new Date(FD.at).toLocaleString()+'</span>':'');
 $('fDone').textContent=FD&&FD.done?'✓ Done (tap to update note)':'✓ Mark this done'}
window.openFin=function(){fsum();if(FD&&FD.note)$('fnote').value=FD.note;$('fsheet').classList.add('on')};
$('finBtn').onclick=openFin;$('fX').onclick=$('fKeep').onclick=()=>$('fsheet').classList.remove('on');
$('fDone').onclick=async()=>{if(!db){$('fst').textContent='Sign in to claude.ai so this saves.';return}
 let y=0,n=0;Object.values(V).forEach(o=>Object.values(o||{}).forEach(v=>{if(v==='y')y++;else if(v==='n'||v==='s')n++}));
 const x={done:true,note:$('fnote').value.trim(),yes:y,no:n,at:new Date().toISOString()};
 for(let k=0;k<4;k++){try{await db.collection(SC).doc('done').set(x);FD=x;fsum();$('fst').textContent='Saved ✓ Claude will pick this up. Tap "Back to my HQ list" when you\'re ready.';return}catch(e){await new Promise(r=>setTimeout(r,700))}}
 $('fst').textContent='Couldn’t save. Tap again.'};
const ft=$('foot');new MutationObserver(()=>{if(/All done/.test(ft.textContent))openFin()}).observe(ft,{childList:true,characterData:true,subtree:true});
(async function w(){for(let k=0;k<40&&!db;k++)await new Promise(r=>setTimeout(r,250));if(!db)return;try{const q=await db.collection(SC).limit(10).get();q.docs.forEach(d=>{if(d.id==='done')FD=d.data()})}catch(e){}})();
})();
</script></body></html>
