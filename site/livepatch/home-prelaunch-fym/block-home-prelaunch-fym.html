<div id="mmfym" data-mmfym="prelaunch-v2">
<style>
@import url('https://fonts.googleapis.com/css2?family=Caprasimo&family=Bitter:ital,wght@0,500;0,700;1,700&display=swap');
/* hide the old homepage hero section; this block draws the new one in its place */
body.mmfym-on #page section[data-section-id="69b1d01489d0f8016ee3d59f"],.mmfym-old{display:none!important}
.fe-block:has(#mmfym){display:none!important}
#mmfym{--navy:#062a55;--rose:#c8325f;--pink:#f56c8c;--cream:#fffaf5;--blush:#fdeef2;--ink:#2d3a52;color:var(--navy);font-family:'Bitter',Georgia,serif}
#mmfym *{box-sizing:border-box}
#mmfym .w{max-width:1180px;margin:0 auto;padding:0 20px}
#mmfym p{margin:0}
#mmfym h1,#mmfym h2,#mmfym h3{font-family:'Caprasimo',Georgia,serif;font-weight:400;color:var(--navy);margin:0;text-wrap:balance;letter-spacing:0}
#mmfym p,#mmfym li{text-wrap:pretty}
#mmfym .nb{white-space:nowrap}
#mmfym .hero{position:relative;overflow:hidden;padding:30px 0 40px;background:radial-gradient(circle at 2% 100%,var(--blush) 0,var(--blush) 15%,transparent 15.2%),var(--cream)}
#mmfym .hg{display:grid;grid-template-columns:1fr;gap:26px;align-items:center;text-align:center}
#mmfym .pill{display:inline-block;background:var(--navy);color:#fff;font:700 13px/1 'Bitter',Georgia,serif;letter-spacing:.16em;text-transform:uppercase;padding:9px 16px 8px;border-radius:99px}
#mmfym h1{font-size:clamp(44px,11vw,78px);line-height:1.02;margin-top:16px;word-spacing:-.06em}
#mmfym h1 em{font-style:italic}
#mmfym h1 sup{font-family:'Bitter',Georgia,serif;font-weight:700;font-size:.28em;vertical-align:super;margin-left:.06em;letter-spacing:0}
#mmfym .lede{font-size:clamp(18px,4.6vw,21px);line-height:1.45;color:var(--ink);margin:16px auto 0;max-width:30em}
#mmfym .acts{display:flex;flex-wrap:wrap;gap:12px 18px;align-items:center;justify-content:center;margin-top:24px}
#mmfym .btn{display:inline-flex;align-items:center;gap:.5em;min-height:54px;padding:0 30px;border-radius:999px;background:var(--rose);color:#fff!important;text-decoration:none!important;font:700 18px/1 'Bitter',Georgia,serif;box-shadow:0 12px 26px rgba(200,50,95,.28);transition:transform .15s ease}
#mmfym .btn:hover{transform:translateY(-2px)}
#mmfym .tl{color:var(--navy)!important;font-weight:700;font-size:16px;text-decoration:underline!important;text-underline-offset:3px}
#mmfym .small{font-size:14.5px;color:#5b6577;margin-top:14px}
#mmfym .art{position:relative;max-width:300px;margin:14px auto 0;width:72%}
#mmfym .art img{position:relative;z-index:1;display:block;width:100%;height:auto;transform:rotate(3deg);filter:drop-shadow(0 22px 34px rgba(6,42,85,.18))}
#mmfym .art::before{content:'';position:absolute;z-index:0;left:50%;top:50%;width:118%;aspect-ratio:1;transform:translate(-50%,-50%);border-radius:50%;background:radial-gradient(circle,#fff 0,#fff 38%,#fbd9e2 38.4%,#fbd9e2 100%)}
#mmfym .hz{position:absolute;z-index:2;color:var(--pink);font-family:Arial,sans-serif;line-height:1;pointer-events:none}
#mmfym .hz.a{left:-6%;top:12%;font-size:34px;transform:rotate(-14deg)}
#mmfym .hz.b{right:-4%;top:4%;font-size:22px;transform:rotate(12deg);color:var(--rose)}
#mmfym .hz.c{right:-8%;bottom:20%;font-size:40px;transform:rotate(10deg)}
#mmfym .ribbon{position:absolute;z-index:3;left:-8%;bottom:9%;background:var(--navy);color:#fff;font:400 22px/1 'Caprasimo',Georgia,serif;padding:12px 18px 13px;border-radius:14px;transform:rotate(-6deg);box-shadow:0 10px 22px rgba(6,42,85,.28)}
#mmfym .ribbon i{font-style:normal;color:#ffc9d8}
@media(min-width:800px){
 #mmfym .hero{padding:44px 0 52px}
 #mmfym .hg{grid-template-columns:1.25fr .75fr;gap:40px;text-align:left;max-width:1040px}
 #mmfym .lede{margin-left:0}
 #mmfym .acts{justify-content:flex-start}
 #mmfym .art{max-width:290px;width:100%;margin:0 auto}
 #mmfym .ribbon{font-size:26px}
}
</style>
<section class="hero" aria-labelledby="mmfym-h1"><div class="w hg">
<div class="copy">
<span class="pill">Coming 10.27</span>
<h1 id="mmfym-h1"><span class="nb">Find Your</span> <span class="nb">Mat-ch<sup>&trade;</sup></span></h1>
<p class="lede">Start with your tiles or your mat. Swipe. Find your&nbsp;match.</p>
<div class="acts"><a class="btn" href="#mmfym-signup" data-mmfym-signup>Save my spot <span aria-hidden="true">&#9829;</span></a><a class="tl" href="/mahjong-tile-matches">or browse the albums</a></div>
</div>
<div class="art"><img src="https://cdn.jsdelivr.net/gh/tiffanybrie/mahjmatchmaker-data@570b99d18977107da6b3be40487d010a95b65171/assets/site/home-prelaunch/start-phone.webp" width="560" height="1082" fetchpriority="high" decoding="async" alt="The Find Your Mat-ch start screen on a phone: pick I have tiles or I have a mat"><span class="hz a" aria-hidden="true">&#9829;</span><span class="hz b" aria-hidden="true">&#9829;</span><span class="hz c" aria-hidden="true">&#9829;</span><span class="ribbon" aria-hidden="true">Opens <i>10.27</i></span></div>
</div></section>
<script>
(function(){
 var b=document.getElementById('mmfym');if(!b||b.dataset.moved)return;b.dataset.moved=1;
 // pre-launch only: at launch (Tue Oct 27, 9:00am CT = 14:00 UTC) this block removes itself and the original hero shows again
 if(Date.now()>=Date.parse('2026-10-27T14:00:00Z')){b.remove();return;}
 document.body.classList.add('mmfym-on');
 function place(){
  var secs=document.querySelectorAll('#page article > .page-section, #page .sections > .page-section, #page section.page-section');
  var first=secs[0];
  if(first&&first!==b){first.parentNode.insertBefore(b,first);first.classList.add('mmfym-old');}
  var hd=document.querySelector('header#header, #header');
  function pad(){if(!hd)return;var cs=getComputedStyle(hd);b.style.paddingTop=(cs.position==='fixed'||cs.position==='absolute')?Math.max(0,Math.round(hd.getBoundingClientRect().bottom))+'px':'';}
  // Tiffany 3:58pm bug: at the very top the "Coming 10.27 / Find Your Mat-ch" title vanished. The announcement bar renders late, the
  // header grows ~45px AFTER the first pad() and covers the title; scrolling hid the header so the title came back. Re-pad on every size change.
  pad();window.addEventListener('resize',pad);window.addEventListener('load',pad);window.addEventListener('scroll',function(){if(scrollY<5)pad()},{passive:true});
  if(window.ResizeObserver&&hd){try{new ResizeObserver(pad).observe(hd)}catch(e){}}
  [400,1200,2500,5000].forEach(function(t){setTimeout(pad,t)});
  // signup target = the existing homepage Newsletter block ("Get New Matches First")
  var nl=document.querySelector('.newsletter-block, .sqs-block-newsletter');
  if(nl){nl.id='mmfym-signup';}
  document.querySelectorAll('[data-mmfym-signup]').forEach(function(a){
   if(!nl){a.href='/mahjong-tile-matches';return;}
   a.addEventListener('click',function(e){e.preventDefault();nl.scrollIntoView({behavior:'smooth',block:'center'});var i=nl.querySelector('input[type=email],input');if(i)setTimeout(function(){i.focus({preventScroll:true})},600);});
  });
 }
 if(document.readyState==='loading')document.addEventListener('DOMContentLoaded',place);else place();
})();
</script>
</div>
