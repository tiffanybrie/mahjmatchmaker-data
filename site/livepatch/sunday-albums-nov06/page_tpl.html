<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Sunday New Mats</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=Caprasimo&family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#faf6ef;--card:#fff;--ink:#1d2433;--soft:#5d6577;--line:#e6dfd2;--navy:#1f3a6b;--pink:#d9467f;--yes:#2e9d5e;--no:#b8434a;--chip:#f1ebe0}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#15171c;--card:#1f2229;--ink:#eef0f4;--soft:#a9b0bf;--line:#30343d;--navy:#8fb0ec;--chip:#2a2e37}}
:root[data-theme="dark"]{--bg:#15171c;--card:#1f2229;--ink:#eef0f4;--soft:#a9b0bf;--line:#30343d;--navy:#8fb0ec;--chip:#2a2e37}
*{box-sizing:border-box}html,body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.45 Inter,-apple-system,BlinkMacSystemFont,sans-serif}
.wrap{max-width:640px;margin:0 auto;padding:16px 16px 120px}
h1{font-family:Caprasimo,Georgia,serif;font-weight:400;font-size:28px;line-height:1.15;margin:4px 0 6px;color:var(--navy)}
.lead{color:var(--soft);margin:0 0 14px;font-size:15px}
.tabs{position:sticky;top:0;z-index:5;background:var(--bg);display:flex;gap:8px;overflow-x:auto;padding:10px 0;margin:0 0 6px;scrollbar-width:none}
.tabs a{flex:none;text-decoration:none;color:var(--ink);background:var(--chip);border-radius:99px;padding:8px 14px;font-weight:600;font-size:14px;white-space:nowrap}
.tabs a b{color:var(--pink)}
section{margin:22px 0 8px;scroll-margin-top:60px}
.sh{display:flex;align-items:center;gap:12px;margin-bottom:10px}
.sh img{width:56px;height:56px;border-radius:12px;object-fit:cover;flex:none}
.sh h2{font-family:Caprasimo,Georgia,serif;font-weight:400;font-size:22px;margin:0;line-height:1.1}
.sh p{margin:2px 0 0;color:var(--soft);font-size:13px}
.m{background:var(--card);border:1px solid var(--line);border-radius:18px;overflow:hidden;margin:0 0 16px}
.v{position:relative;aspect-ratio:1/1;background:#ddd;cursor:zoom-in}
.v .mat{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.v .tl{position:absolute;right:0;bottom:0;width:40%;aspect-ratio:1/1;object-fit:cover;border:5px solid #fff;border-right:0;border-bottom:0;border-top-left-radius:18px;box-shadow:0 6px 18px rgba(0,0,0,.35)}
.v .z{position:absolute;left:10px;top:10px;background:rgba(0,0,0,.55);color:#fff;font-size:12px;border-radius:99px;padding:4px 10px}
.v .st{position:absolute;left:10px;bottom:10px;color:#fff;font-weight:700;border-radius:99px;padding:5px 12px;font-size:14px;display:none}
.m.y .st{display:block;background:var(--yes)}.m.n .st{display:block;background:var(--no)}
.info{padding:12px 14px 14px}
.nm{font-weight:700;font-size:17px}.br{color:var(--soft);font-size:14px}.why{font-size:13px;color:var(--soft);margin-top:4px}
.btns{display:flex;gap:10px;margin-top:12px}
.btns button{flex:1;border:0;border-radius:14px;padding:13px 0;font:inherit;font-weight:700;font-size:17px;cursor:pointer;background:var(--chip);color:var(--ink)}
.m.y .by{background:var(--yes);color:#fff}.m.n .bn{background:var(--no);color:#fff}
.bar{position:fixed;left:0;right:0;bottom:0;background:var(--card);border-top:1px solid var(--line);padding:10px 16px calc(10px + env(safe-area-inset-bottom));display:flex;gap:10px;align-items:center;justify-content:center;z-index:6}
.bar .c{font-size:14px;color:var(--soft)}
.bar button{border:0;border-radius:14px;background:var(--pink);color:#fff;font:inherit;font-weight:700;padding:12px 18px;cursor:pointer}
.ov{position:fixed;inset:0;background:rgba(10,10,14,.94);z-index:9;display:none;overflow:auto;-webkit-overflow-scrolling:touch}
.ov.on{display:block}.ov .in{position:relative;width:min(100vw,900px);margin:0 auto;aspect-ratio:1/1;margin-top:max(0px,calc(50vh - min(50vw,450px)))}
.ov .in img.mat{width:100%;height:100%;object-fit:contain}
.ov .in .tl{position:absolute;right:0;bottom:0;width:36%;aspect-ratio:1/1;object-fit:cover;border:5px solid #fff;border-right:0;border-bottom:0;border-top-left-radius:18px}
.ov .x{position:fixed;right:14px;top:14px;z-index:10;background:#fff;color:#111;border:0;border-radius:99px;width:44px;height:44px;font-size:22px;cursor:pointer}
.ov .t{position:fixed;left:14px;bottom:14px;right:70px;color:#fff;font-size:14px;z-index:10}
.toast{position:fixed;left:50%;bottom:84px;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:12px;font-size:14px;display:none;z-index:8;max-width:calc(100% - 32px)}
</style></head><body>
<div class="wrap">
<h1>Sunday sets: new mats only</h1>
<p class="lead">Your Nature Walk, Sunday Blues, Plum Panda and Hummingbird yeses are already in the album drafts. These are only the mats added to Find <i>Your</i> Mat-ch since you swiped. Tap a photo to zoom. ♥ or ✕, then Copy my picks and paste it in chat.</p>
<nav class="tabs" id="tabs"></nav>
<div id="list"></div>
</div>
<div class="bar"><span class="c" id="cnt"></span><button id="copy">Copy my picks</button></div>
<div class="ov" id="ov"><button class="x" id="ox" aria-label="Close">✕</button><div class="in" id="oin"></div><div class="t" id="ot"></div></div>
<div class="toast" id="toast"></div>
<script>
const D=__DATA__;
const KEY='sunday-new-mats-nov06';let V={};try{V=JSON.parse(localStorage.getItem(KEY)||'{}')}catch(e){}
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
let tabs='',out='';
for(const s of D.sets){
  tabs+=`<a href="#${s.id}">${esc(s.name)} <b>${s.mats.length}</b></a>`;
  out+=`<section id="${s.id}"><div class="sh"><img src="${s.tile}" alt="${esc(s.name)} tiles"><div><h2 style="color:${s.col}">${esc(s.name)}</h2><p>${esc(s.sub)} · ${s.mats.length} new mats</p></div></div>`;
  for(const m of s.mats){
    out+=`<div class="m" data-id="${m.id}"><div class="v" data-set="${s.id}"><img class="mat" loading="lazy" src="${m.img}" alt="${esc(m.name)}"><img class="tl" loading="lazy" src="${s.tile}" alt="${esc(s.name)} tiles"><span class="z">Tap to zoom</span><span class="st"></span></div>
    <div class="info"><div class="nm">${esc(m.name)}</div><div class="br">${esc(m.brand)}</div>${m.why?`<div class="why">${esc(m.why)}</div>`:''}
    <div class="btns"><button class="bn" data-v="n" aria-label="No">✕</button><button class="by" data-v="y" aria-label="Yes">♥</button></div></div></div>`;
  }
  out+='</section>';
}
document.getElementById('tabs').innerHTML=tabs;document.getElementById('list').innerHTML=out;
const ALL={};for(const s of D.sets)for(const m of s.mats)ALL[m.id]={s,m};
function paint(){let y=0,n=0,t=0;document.querySelectorAll('.m').forEach(el=>{const v=V[el.dataset.id];el.classList.toggle('y',v==='y');el.classList.toggle('n',v==='n');el.querySelector('.st').textContent=v==='y'?'♥ Yes':v==='n'?'✕ No':'';t++;if(v==='y')y++;if(v==='n')n++});
  document.getElementById('cnt').textContent=`${y} ♥ · ${n} ✕ · ${t-y-n} left`}
function save(){try{localStorage.setItem(KEY,JSON.stringify(V))}catch(e){}}
document.getElementById('list').addEventListener('click',e=>{
  const b=e.target.closest('button[data-v]');if(b){const id=b.closest('.m').dataset.id;V[id]=V[id]===b.dataset.v?undefined:b.dataset.v;save();paint();return}
  const v=e.target.closest('.v');if(v){const id=v.closest('.m').dataset.id,{s,m}=ALL[id];
    document.getElementById('oin').innerHTML=`<img class="mat" src="${m.img}" alt=""><img class="tl" src="${s.tile}" alt="">`;
    document.getElementById('ot').textContent=`${s.name} + ${m.name} · ${m.brand}`;document.getElementById('ov').classList.add('on')}});
document.getElementById('ox').onclick=()=>document.getElementById('ov').classList.remove('on');
document.getElementById('ov').addEventListener('click',e=>{if(e.target.id==='ov')e.currentTarget.classList.remove('on')});
function toast(t){const el=document.getElementById('toast');el.textContent=t;el.style.display='block';setTimeout(()=>el.style.display='none',3200)}
document.getElementById('copy').onclick=async()=>{
  const lines=[];for(const s of D.sets){const y=s.mats.filter(m=>V[m.id]==='y').map(m=>`${m.name} (${m.brand})`),n=s.mats.filter(m=>V[m.id]==='n').map(m=>m.name);
    if(y.length||n.length)lines.push(`${s.name}: YES ${y.join(', ')||'none'}${n.length?' | NO '+n.join(', '):''}`)}
  const txt='Sunday new mats picks: '+(lines.join(' ; ')||'none yet');
  try{await navigator.clipboard.writeText(txt);toast('Copied. Paste it in chat.')}catch(e){prompt('Copy this and paste it in chat:',txt)}};
paint();
</script>
</body></html>
