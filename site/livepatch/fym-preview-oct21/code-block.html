<div class="fymp" id="fymp"><div class="fymp-ld" id="fymp-ld">Loading Find <i>Your</i> Mat-ch&trade;&hellip;</div><iframe id="fymp-f" class="fymp-f" title="Find Your Mat-ch" allow="web-share; clipboard-write; fullscreen" loading="eager"></iframe></div>
<style>
.fymp{position:relative;width:100%;height:calc(100svh - 80px);min-height:560px;background:#fdf3f7;overflow:hidden}
.fymp-f{position:absolute;inset:0;width:100%;height:100%;border:0;display:block;background:transparent}
.fymp-ld{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font:700 18px 'Bitter',Georgia,serif;color:#054689}
section:has(#fymp) .section-background{background:#fdf3f7!important}
section:has(#fymp) .content-wrapper{padding-top:0!important;padding-bottom:0!important}
.fymp-ld.err{color:#c8325f;padding:0 24px;text-align:center}
</style>
<script>
(function(){
  /* Find Your Mat-ch preview: static copy of the live artifact build, served from jsDelivr (pinned commit).
     jsDelivr serves .html as text/plain + nosniff, so the HTML is fetched here and run in a same-origin
     srcdoc iframe with a <base href> pointing at jsDelivr; scripts, data and images load from there. */
  var BASE='https://cdn.jsdelivr.net/gh/tiffanybrie/mahjmatchmaker-data@c3286209f334781889993ed40e0248fd166cd4ee/site-app/fym-oct21d/';
  var box=document.getElementById('fymp'),f=document.getElementById('fymp-f'),ld=document.getElementById('fymp-ld');
  if(!box||box.getAttribute('data-on'))return;box.setAttribute('data-on','1');
  function size(){
    var h=document.querySelector('header#header,.header'),off=0;
    if(h){var cs=getComputedStyle(h);if(cs.position==='fixed'||cs.position==='sticky'){off=h.getBoundingClientRect().height;}}
    var vh=window.innerHeight||document.documentElement.clientHeight;
    box.style.height=Math.max(560,Math.round(vh-off))+'px';
    /* full bleed: stretch to the page edges whatever column the code block sits in */
    var pr=box.parentElement.getBoundingClientRect(),cw=document.documentElement.clientWidth;
    box.style.marginLeft=(-pr.left)+'px';box.style.width=cw+'px';
  }
  size();window.addEventListener('resize',size);window.addEventListener('load',size);[300,1000,2500].forEach(function(t){setTimeout(size,t)});
  if(window.ResizeObserver){try{new ResizeObserver(size).observe(box.parentElement)}catch(e){}}
 window.addEventListener('orientationchange',function(){setTimeout(size,250)});
  function get(n){return fetch(BASE+'index.html',{cache:'force-cache'}).then(function(r){if(!r.ok)throw r.status;return r.text()}).catch(function(e){if(n>0)return new Promise(function(ok){setTimeout(ok,1500)}).then(function(){return get(n-1)});throw e;});}
  get(4).then(function(t){
    t=t.replace(/<head>/i,'<head><base href="'+BASE+'">');
    f.addEventListener('load',function(){ld.style.display='none';});
    f.srcdoc=t;
  }).catch(function(){ld.className+=' err';ld.textContent='Find Your Mat-ch did not load. Please refresh the page.';});
})();
</script>
